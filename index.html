<style>html{box-sizing:border-box;height:100%;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}body{margin:0;height:100%}img{max-width:100%}</style>
</head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 卓を真上から: 中央に点数盤、下に自分の河、左右に相手の河（横向き）、上段に相手の副露 */
:root {
  --felt: #17463f;
  --felt-deep: #0a2420;
  --felt-line: #2f6359;
  --board: #0c2a26;
  --ink: #eaf1ec;
  --ink-dim: #9fbab2;
  --gold: #e0b84f;
  --vermilion: #e0483a;
  --back: #2b7aa0;
  --back-deep: #1a5370;
  --f-mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
/* ページ全体は絶対にスクロールさせない */
html { overflow: hidden; overscroll-behavior: none; }
html { background: var(--felt-deep); }
/* 縦持ちのときは画面ごと90°回して、常に横画面で遊べるようにする（--W/--H は回したあとの横幅・高さ） */
html.rot body { position: fixed; left: 0; top: 0; width: var(--W); height: var(--H); transform-origin: 0 0; transform: rotate(90deg) translateY(-100%); }
[hidden] { display: none !important; }
body {
  background: var(--felt-deep);
  color: var(--ink); font-family: var(--f-ui); margin: 0;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
#app {
  height: var(--H, 100%); max-width: 560px; margin: 0 auto; box-sizing: border-box;
  padding: 4px 12px 8px; display: flex; flex-direction: column; gap: 5px;
  --hw: min(42px, calc((min(var(--W, 100vw), 560px) - 34px) / 14.8));
}
.top { display: flex; align-items: center; justify-content: space-between; min-height: 26px; }
.top .ttl { font-family: var(--f-mincho); font-weight: 800; font-size: 15px; color: var(--ink-dim); letter-spacing: .1em; }
.iconbtn { white-space: nowrap; background: none; border: 1px solid var(--felt-line); color: var(--ink); border-radius: 8px; padding: 3px 10px; font: 500 13px var(--f-ui); }

/* 卓 */
#table {
  --rw: min(22px, calc((min(var(--W, 100vw), 560px) - 64px) / 19.6));
  --pw: calc(var(--rw) * 6.4 + 6px);
  --ph: calc(var(--rw) * 1.47 * 4 + 4px);
  --bk: calc(var(--rw) * .9);
  display: grid; justify-content: center; gap: 4px;
  grid-template-columns: var(--bk) var(--ph) var(--pw) var(--ph) var(--bk);
  grid-template-rows: auto var(--pw) var(--ph);
  padding: 8px 6px 10px; border-radius: 16px;
  background: radial-gradient(90% 80% at 50% 50%, var(--felt) 0%, #123c36 60%, #0e302b 100%);
  box-shadow: inset 0 0 0 1px var(--felt-line), inset 0 0 30px rgba(0,0,0,.35);
}
.card { min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12px; border-radius: 8px; padding: 4px 5px; }
.card.turn { box-shadow: inset 0 0 0 1.5px var(--gold); }
#card2 { grid-column: 1 / 3; grid-row: 1; }
#card1 { grid-column: 4 / 6; grid-row: 1; align-items: flex-end; text-align: right; }
#wallinfo { grid-column: 3; grid-row: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; font-size: 11px; color: var(--ink-dim); }
.ph { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
#card1 .ph { justify-content: flex-end; }
.nm { font-weight: 700; color: var(--ink); white-space: nowrap; }
.tag { border-radius: 4px; padding: 0 5px; font-weight: 700; font-size: 10.5px; line-height: 15px; white-space: nowrap; }
.tag.riichi { background: var(--vermilion); color: #fff; }
.tag.kiza { background: #e8e2cf; color: #3a2f12; }
.tag.chip { border: 1px solid var(--gold); color: var(--gold); }
.melds { display: flex; flex-wrap: wrap; gap: 3px; align-items: flex-end; }
#card1 .melds { justify-content: flex-end; }
.meld { display: inline-flex; align-items: flex-end; gap: 1px; }
#backs2 { grid-column: 1; grid-row: 2 / 4; }
#backs1 { grid-column: 5; grid-row: 2 / 4; }
.backs { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
.backs .t { --w: calc(var(--rw) * .64); --sl: calc(var(--w) * .1); }
#pond2 { grid-column: 2; grid-row: 2; }
#center { grid-column: 3; grid-row: 2; }
#pond1 { grid-column: 4; grid-row: 2; }
#river0 { grid-column: 3; grid-row: 3; }
.pondwrap { position: relative; }
.pondwrap .river { position: absolute; left: 50%; top: 50%; }
#pond2 .river { transform: translate(-50%, -50%) rotate(90deg); }
#pond1 .river { transform: translate(-50%, -50%) rotate(-90deg); }
.river { width: var(--pw); height: var(--ph); display: flex; flex-wrap: wrap; align-content: flex-start; align-items: flex-end; gap: 0 1px; --w: var(--rw); }
.river .t { --sl: calc(var(--w) * .1); }

/* 中央の点数盤 */
#center { position: relative; background: var(--board); border-radius: 10px; box-shadow: 0 0 0 1px #3c6e64, 0 4px 10px rgba(0,0,0,.4); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; overflow: hidden; }
#center .rnd { font-family: var(--f-mincho); font-weight: 800; font-size: calc(var(--rw) * .82); line-height: 1.1; }
#center .meta { font-size: max(8px, calc(var(--rw) * .48)); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
#center .dora { display: flex; gap: 1px; --w: calc(var(--rw) * .62); }
#center .dora .t { --sl: calc(var(--w) * .1); }
.cs { position: absolute; display: flex; align-items: center; gap: 3px; white-space: nowrap; font-size: max(8px, calc(var(--rw) * .52)); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-dim); }
.cs .cchip { font-weight: 500; color: var(--gold); margin-left: 4px; }
.vnk { margin-top: calc(var(--rw) * .2); }
.cs .wd { font-family: var(--f-mincho); font-size: calc(var(--rw) * .62); color: var(--ink); }
.cs .wd.dealer { color: var(--vermilion); }
.cs.turn { color: var(--gold); }
.cs.turn::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--gold); border-radius: 1px; bottom: -3px; }
.cs.b { bottom: 4px; left: 50%; transform: translateX(-50%); }
.cs.l { left: calc(var(--rw) * .6); top: 50%; transform: translate(-50%, -50%) rotate(90deg); }
.cs.r { left: calc(100% - var(--rw) * .6); top: 50%; transform: translate(-50%, -50%) rotate(-90deg); }
.stick { display: inline-block; width: 16px; height: 4px; border-radius: 2px; background: #f4f1e6; position: relative; }
.stick::after { content: ""; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; border-radius: 50%; background: var(--vermilion); transform: translate(-50%, -50%); }

/* 自分 */
.meinfo { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; min-height: 22px; }
.meinfo .melds { margin-left: auto; --w: calc(var(--hw) * .8); }
.melds .meld { gap: 0; }
.spacer { flex: 1; min-height: 0; }
#hint { min-height: 18px; font-size: 12px; color: var(--ink-dim); text-align: center; }
#hint b { color: var(--gold); font-weight: 700; }
#actions { display: flex; gap: 8px; justify-content: center; min-height: 44px; flex-wrap: wrap; }
.iconbtn.autotg { color: var(--ink-dim); }
.iconbtn.autotg.on { background: var(--gold); border-color: var(--gold); color: #1a1406; }
.act { min-width: 96px; height: 50px; border-radius: 22px; border: 0; font: 700 16px var(--f-ui); letter-spacing: .08em; color: #1a1406; background: var(--gold); box-shadow: 0 3px 0 #8a6d22; }
.act:active { transform: translateY(2px); box-shadow: 0 1px 0 #8a6d22; }
.act.red { background: var(--vermilion); color: #fff; box-shadow: 0 3px 0 #8f2017; }
.act.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink-dim); box-shadow: none; }
.act.on { outline: 3px solid #fff; }
#hand { display: flex; justify-content: center; align-items: flex-end; gap: 1px; min-height: calc(var(--hw) * 1.6 + 12px); padding-top: 12px; --w: var(--hw); }
#hand .t { --sl: calc(var(--w) * .2); cursor: pointer; transition: transform .08s; }
#hand .t.sel { transform: translateY(-12px); }
#hand .t.dim { filter: brightness(.55); }
#hand .gap { width: calc(var(--hw) * .35); }

/* 牌：象牙色の面 + 背の色が下に見える厚み */
.t { --sl: calc(var(--w) * .12); display: inline-block; width: var(--w); height: calc(var(--w) * 1.33); flex: none; position: relative; overflow: hidden;
  background: linear-gradient(172deg, #fffdf5 0%, #f6efdc 62%, #e9dec2 100%);
  border-radius: calc(var(--w) * .12);
  box-shadow: inset 0 0 0 .5px rgba(80,60,20,.25), 0 var(--sl) 0 0 var(--back), 0 calc(var(--sl) + 1px) 2px rgba(0,0,0,.5);
  margin-bottom: var(--sl); }
.t i.g { position: absolute; inset: 0; background-size: 100% 100%; background-repeat: no-repeat; }
/* エメラルド北ポッチ：クリスタル一萬と同じく、白い牌に緑の字と緑の縁 */
.t.emerald { box-shadow: inset 0 0 0 1.5px #12a66a, 0 var(--sl) 0 0 var(--back), 0 calc(var(--sl) + 1px) 2px rgba(0,0,0,.5); }
.t.pocchi::before { content: ""; position: absolute; left: 50%; top: 50%; width: 26%; height: 19.5%; border-radius: 50%; background: #d23a2e; transform: translate(-50%, -50%); z-index: 2; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
.t.side.pocchi::before { width: 19.5%; height: 26%; }
.t i.g27, .t i.g28, .t i.g29, .t i.g30 { filter: grayscale(1) brightness(.22); }
.t i.g31::after { content: ""; position: absolute; left: 24%; right: 24%; top: 20%; bottom: 20%; border: max(1px, calc(var(--w) * .07)) solid #2b63b5; border-radius: 8%; }
.t.side.cw i.g { transform: translate(-50%, -50%) rotate(90deg) !important; }
.t.flip i.g { transform: rotate(180deg); }
.t.side i.g { inset: auto; left: 50%; top: 50%; width: var(--w); height: calc(var(--w) * 1.33); transform: translate(-50%, -50%) rotate(-90deg); }
.t.gold { box-shadow: inset 0 0 0 1.5px #c9971f, 0 var(--sl) 0 0 var(--back), 0 calc(var(--sl) + 1px) 2px rgba(0,0,0,.5); }
.t.side { width: calc(var(--w) * 1.33); height: var(--w); }
/* 金牌：普通の白い牌に金色の模様（gg13/gg22）、縁だけ金 */
/* クリスタル一萬（水色）・プラチナ九萬（青）：金牌と同じく白い牌に色付きの模様と縁 */
.t.crystal { box-shadow: inset 0 0 0 1.5px #2fb4dc, 0 var(--sl) 0 0 var(--back), 0 calc(var(--sl) + 1px) 2px rgba(0,0,0,.5); }
.t.platinum { box-shadow: inset 0 0 0 1.5px #4c68d8, 0 var(--sl) 0 0 var(--back), 0 calc(var(--sl) + 1px) 2px rgba(0,0,0,.5); }
.t.back { background: linear-gradient(170deg, #4a96bb, var(--back) 60%, var(--back-deep)); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.3), 0 var(--sl) 0 0 #f1e9d2, 0 calc(var(--sl) + 1px) 2px rgba(0,0,0,.5); }
.t.called { opacity: .35; }
/* ツモ切りは少し暗く、手出しは明るいまま */
.t.tg { filter: brightness(.72) saturate(.75); }
.t.last { box-shadow: inset 0 0 0 2px var(--gold), 0 var(--sl) 0 0 var(--back), 0 calc(var(--sl) + 1px) 2px rgba(0,0,0,.5); }
.t.win { box-shadow: inset 0 0 0 2px var(--vermilion), 0 var(--sl) 0 0 var(--back), 0 calc(var(--sl) + 1px) 2px rgba(0,0,0,.5); }

/* 吹き出し */
#peekBack { position: fixed; left: 50%; top: 2px; transform: translateX(-50%); z-index: 30; min-width: 150px; height: 30px; font-size: 14px; border-radius: 15px; box-shadow: 0 2px 0 #8a6d22; }
.bubble { position: fixed; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none; z-index: 15;
  font-family: var(--f-mincho); font-weight: 800; font-size: 30px; color: #fff; padding: 4px 18px; border-radius: 12px; background: var(--vermilion); box-shadow: 0 4px 18px rgba(0,0,0,.5); transition: transform .18s ease-out, opacity .18s; white-space: nowrap; }
.bubble.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* モーダル */
#modal { position: fixed; inset: 0; background: rgba(4,14,12,.72); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; box-sizing: border-box; }
.sheet { background: #f3eddc; color: #1d2421; border-radius: 16px; width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; padding: 18px 16px; box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,.5); --w: min(24px, calc((min(var(--W, 100vw), 440px) - 64px) / 15)); }
/* 画面からはみ出さないよう、横画面では2列に並べる。スクロールバーは出さない */
.sheet { scrollbar-width: none; }
.sheet::-webkit-scrollbar { display: none; }
.cols > .col + .col { margin-top: 8px; }
html.land .sheet.wide { max-width: min(calc(var(--W) - 24px), 1000px); padding: 14px 20px 16px; }
html.land .sheet.wide:not(:has(.cols)) { max-width: min(calc(var(--W) - 24px), 720px); }
html.land .sheet.wide .cols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; align-items: start; }
html.land .sheet.wide .cols > .col + .col { margin-top: 0; }
html.land .sheet.wide h2 { font-size: 22px; }
html.land .sheet.wide .btn { height: 42px; margin-top: 10px; }
html.land .sheet.wide .btn.alt { margin-top: 6px; }
html.land .sheet.wide td { padding: 3px 2px; }
html.land .sheet.wide .rules { font-size: 12px; line-height: 1.6; margin-top: 4px; }
html.land .sheet.wide .opt { padding: 6px 0; }
html.land .sheet.wide .recbig { font-size: 28px; }
.sheet h2 { font-family: var(--f-mincho); font-weight: 800; font-size: 26px; margin: 0 0 4px; text-wrap: balance; }
.sheet h2 .sub2 { font-size: 15px; font-family: var(--f-ui); font-weight: 700; color: #5b665f; margin-left: 6px; }
.sheet .handrow { display: flex; flex-wrap: wrap; gap: 1px; align-items: flex-end; margin: 10px 0; }
.sheet .handrow .gap { width: 8px; }
.sheet .muted .t { --w: 18px; vertical-align: middle; }
.sheet table { color: inherit; width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.sheet td { padding: 5px 2px; border-bottom: 1px solid #d9d1bb; }
.sheet td.r { text-align: right; }
.sheet .total { font-family: var(--f-mincho); font-weight: 800; font-size: 22px; margin: 8px 0 2px; }
.recbig { font-family: var(--f-mincho); font-weight: 800; font-size: 32px; text-align: center; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.recline { margin: 8px 0 2px; font-size: 14px; }
.sheet table.rec td { padding: 6px 2px; }
.sheet table.cmp td { padding: 5px 3px; font-size: 13px; white-space: nowrap; }
.sheet table.stand td { padding: 3px 2px; font-size: 13px; }
.warn { font-size: 12px; color: #8a3b10; background: #f8dfc8; border-radius: 8px; padding: 6px 10px; }
.pa { align-self: center; margin: 0 3px; font-weight: 700; color: #5b665f; }
.sheet .chips { font-size: 13px; color: #6b5310; background: #f6e5ad; border-radius: 8px; padding: 6px 10px; margin: 8px 0; }
.sheet .muted { color: #5b665f; font-size: 12px; }
.plus { color: #1d7a45; font-weight: 700; }
.minus { color: #b8352a; font-weight: 700; }
.sheet .btn { display: block; width: 100%; height: 48px; margin-top: 14px; border: 0; border-radius: 24px; background: #183f39; color: #fff; font: 700 16px var(--f-ui); letter-spacing: .1em; }
.sheet .btn.alt { background: transparent; color: #183f39; border: 1px solid #183f39; margin-top: 8px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #ddd5bf; font-size: 14px; }
.seg { display: inline-flex; border: 1px solid #183f39; border-radius: 8px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; padding: 6px 10px; font: 700 13px var(--f-ui); color: #183f39; }
.seg button.on { background: #183f39; color: #fff; }
.rules { font-size: 12.5px; line-height: 1.7; color: #3c4641; margin: 8px 0 4px; }
.rules b { color: #1d2421; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
/* 縦画面: サイド要素を縦の流れに並べ替え */
.panel { display: contents; }
.top { order: 0; } #table { order: 1; } .meinfo { order: 2; } .spacer { order: 3; } #hint { order: 4; } #actions { order: 5; } #hand { order: 6; }
/* 横画面: 左に卓、右に操作列、下に手牌 */
.bk { display: flex; flex-direction: column; align-items: center; }
.vmelds { display: none; flex-direction: row; align-items: flex-start; gap: calc(var(--rw) * .3); }
.vmelds .vms { display: flex; flex-direction: column; align-items: center; gap: calc(var(--rw) * .25); }
#backs1 .vmelds { flex-direction: row-reverse; align-items: flex-end; }
#backs1 .vmelds .vms { flex-direction: column-reverse; }
.vmeld { display: flex; flex-direction: column; align-items: center; gap: 1px; }
#backs1 .vmeld { flex-direction: column-reverse; }
.vmelds .t { --w: calc(var(--rw) * .92 * var(--ms, 1)); --sl: calc(var(--w) * .08); }

.mymelds { display: none; flex-direction: column; align-items: flex-end; row-gap: 3px; gap: calc(var(--hw) * .18); margin-left: calc(var(--hw) * .45); --w: calc(var(--hw) * .86); }
.mymelds .meld { display: inline-flex; align-items: flex-end; }
.mymelds .t { cursor: default; }
.mrow { display: inline-flex; align-items: flex-end; gap: 4px; }
.meinfo .melds { flex-direction: column; align-items: flex-end; row-gap: 3px; }
.mymelds .mrow { display: inline-flex; align-items: flex-end; gap: calc(var(--hw) * .18); }
.mymelds .mrow:first-child:not(:last-child) { --w: calc(var(--hw) * .6); }
/* 加槓：横向きの牌を2枚重ねる */
.kstack { display: inline-flex; flex-direction: column; align-items: center; }
.kstack .t { margin-bottom: 0; }
.vkstack { display: inline-flex; flex-direction: row; gap: 1px; }
/* 横画面レイアウト（常に使う。縦持ちのときは画面ごと90°回して横画面にする） */
  /* 横画面：卓を画面の横幅いっぱいに使う。
     端の列＝相手の手牌（裏）と副露、その内側＝相手の河（大きめ）、中央＝点数盤と自分の河、下＝手牌 */
  html.land .vmelds { display: flex; }
  html.land .mymelds { display: inline-flex; }
  html.land #card1 .melds, html.land #card2 .melds { display: none; }
  html.land #meinfo, html.land .spacer, html.land #wallinfo { display: none; }
  html.land #app {
    max-width: none; padding: 34px 0 0; gap: 0; position: relative;
    --hw: min(52px, calc(var(--W) / 16), calc(var(--H) * .135));
    --th: calc(var(--H) - var(--hw) * 1.33 - var(--hw) * .2 - 50px);
    --rw: min(38px, calc(var(--th) / 11.2));
    --pw: calc(var(--rw) * 6.4 + 6px);
    --ew: calc(var(--rw) * 2.3);
    --srw: min(var(--rw), calc((var(--th) - 12px) / 6.7), calc((var(--W) - var(--pw) - var(--ew) * 2 - 40px) / 11.9));
    --sph: calc(var(--srw) * 1.47 * 4 + 6px);
    display: grid;
    grid-template-columns: minmax(var(--ew), 1fr) var(--sph) var(--pw) var(--sph) minmax(var(--ew), 1fr);
    grid-template-rows: var(--pw) calc(var(--th) - var(--pw)) auto;
    column-gap: 6px;
  }
  html.land #app::before { content: ""; grid-column: 1 / 6; grid-row: 1 / 3; border-radius: 0 0 22px 22px; z-index: 0;
    background: radial-gradient(85% 90% at 50% 40%, var(--felt) 0%, #123c36 60%, #0e302b 100%); box-shadow: inset 0 0 0 1px var(--felt-line), inset 0 0 40px rgba(0,0,0,.35); }
  html.land #app > *, html.land #table > *, html.land .panel > * { z-index: 1; }
  html.land #table, html.land .panel { display: contents; }
  html.land #table { --rw: inherit; --pw: inherit; }
  /* 端の列：相手の手牌と副露 */
  html.land #backs2 { grid-column: 1; grid-row: 1 / 3; justify-self: start; padding: 58px 0 calc(var(--hw) * .55) 10px; }
  html.land #backs1 { grid-column: 5; grid-row: 1 / 3; justify-self: end; padding: 58px 10px calc(var(--hw) * 1.1) 0; }
  html.land .backs { flex-direction: row; align-items: center; justify-content: center; gap: calc(var(--rw) * .3); }
  html.land .backs .bk { flex-direction: column; }
  html.land .backs .t { --w: calc(var(--rw) * 1.0 * var(--ms, 1)); }
  html.land .backs .vmelds .t { --w: calc(var(--rw) * 1.25 * var(--ms, 1)); }
  html.land #backs2, html.land #backs1 { flex-direction: row; align-items: center; gap: calc(var(--rw) * .35); }
  html.land #backs2 .vmelds { align-self: flex-end; align-items: flex-end; }
  html.land #backs1 .vmelds { align-self: flex-start; align-items: flex-start; }
  /* 相手の名前は端の列の上 */
  html.land #card2 { grid-column: 1; grid-row: 1; align-self: start; justify-self: start; padding: 6px 10px; z-index: 2; }
  html.land #card1 { grid-column: 5; grid-row: 1; align-self: start; justify-self: end; padding: 6px 10px; margin-top: 30px; z-index: 2; }
  html.land #card1 .ph { justify-content: flex-end; }
  /* 相手の河は大きく、上下いっぱい */
  /* 相手の河は点数盤の左右にぴったり並べる（点数盤と同じ高さ）。
     上家は点数盤の左上から下へ、下家は点数盤の右下から上へ打ち出す */
  html.land #pond2 { grid-column: 2; grid-row: 1; margin-top: 6px; }
  html.land #pond1 { grid-column: 4; grid-row: 1; margin-top: 6px; }
  html.land #pond2 .river, html.land #pond1 .river { --w: var(--srw); width: calc(var(--srw) * 6.4 + 6px); height: var(--sph); }
  /* 中央：点数盤と自分の河 */
  html.land #center { grid-column: 3; grid-row: 1; margin-top: 6px; }
  html.land #river0 { grid-column: 3; grid-row: 2; align-self: start; margin-top: 4px; height: auto; }
  html.land #hint { position: absolute; left: 12px; bottom: calc(var(--hw) * 1.5 + 8px); text-align: left; font-size: 12px; z-index: 6; }
  /* メニューは右上、ボタンは手牌の右上に重ねる */
  html.land .top { position: absolute; top: 4px; right: 8px; min-height: 0; z-index: 3; }
  html.land .top .ttl { display: none; }
  html.land .iconbtn { padding: 2px 8px; font-size: 12px; }
  html.land #actions { position: absolute; right: 10px; bottom: calc(var(--hw) * 1.55 + 10px); flex-direction: row; align-items: flex-end; min-height: 0; gap: 8px; z-index: 6; }
  html.land .act { height: 54px; min-width: 112px; font-size: 19px; border-radius: 27px; }
  html.land #hand { grid-column: 1 / 6; grid-row: 3; padding: 8px 0 calc(var(--hw) * .08); min-height: calc(var(--hw) * 1.45 + 6px); }

/* iPadなど大きい画面：牌の上限サイズを広げて画面いっぱいに使う（スマホは変えない） */
/* 横画面レイアウト（常に使う。縦持ちのときは画面ごと90°回して横画面にする） */
  html.land.big #app {
    padding-top: 44px;
    --hw: min(86px, calc(var(--W) / 17.5), calc(var(--H) * .11));
    --th: calc(var(--H) - var(--hw) * 1.33 - var(--hw) * .2 - 64px);
    /* 自分の河と相手の河を同じ大きさにする：横幅に3つの河が収まる大きさを上限に */
    --rw: min(66px, calc(var(--th) / 11.2), calc((var(--W) - 50px) / 27.5));
    /* 端の列（相手の手牌・副露・抜き北の3列ぶん）が河に重ならない幅を確保 */
    --ew: calc(var(--rw) * 4.4);
  }
  html.land.big .iconbtn { padding: 5px 14px; font-size: 16px; }
  html.land.big .top { top: 6px; right: 12px; }
  /* 相手の副露・抜き北は相手の河の牌と同じ大きさ */
  html.land.big .backs .t { --w: calc(var(--srw) * var(--ms, 1)); }
  html.land.big .backs .vmelds .t { --w: calc(var(--srw) * var(--ms, 1)); }
  html.land.big .act { height: 66px; min-width: 140px; font-size: 23px; border-radius: 33px; }
  html.land.big #hint { font-size: 15px; }

@media (prefers-reduced-motion: reduce) { .bubble, #hand .t { transition: none; } }

<script>
// ===== 三麻エンジン（赤3金1 / 北抜き / 40符固定ツモ損なし / チップ） =====
(function (G) {
'use strict';

// ---- 牌の基本 ----
// 0-8:萬子 9-17:筒子 18-26:索子 27東 28南 29西 30北 31白 32發 33中
const KINDS = [0, 8];
for (let k = 9; k < 34; k++) KINDS.push(k);
const NORTH = 30, P5 = 13, S5 = 22;
const isNum = k => k < 27;
const isYaochu = k => k >= 27 || k % 9 === 0 || k % 9 === 8;
const isSimple = k => k < 27 && !isYaochu(k);
const isDragon = k => k >= 31;
const isWind = k => k >= 27 && k <= 30;
const KIND_NAME = (() => {
  const a = [];
  const nums = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
  for (let i = 0; i < 9; i++) a.push(nums[i] + '萬');
  for (let i = 0; i < 9; i++) a.push((i + 1) + '筒');
  for (let i = 0; i < 9; i++) a.push((i + 1) + '索');
  return a.concat(['東', '南', '西', '北', '白', '發', '中']);
})();
const WIND_NAME = { 27: '東', 28: '南', 29: '西', 30: '北' };
// 点数方式と七対子の扱い（Game を作ったときにそのルールに切り替わる）
const MODE = { scoring: 'v1', chiitoi4: false };
function setMode(opts) { MODE.scoring = opts.scoring || 'v1'; MODE.chiitoi4 = !!opts.chiitoi4; }

function nextDora(k) {
  if (k === 0) return 8;
  if (k === 8) return 0;
  if (k < 27) { const b = k - k % 9; return b + ((k % 9) + 1) % 9; }
  if (k <= 30) return k === 30 ? 27 : k + 1;
  return k === 33 ? 31 : k + 1;
}

function makeRng(seed) {
  if (seed == null) return Math.random;
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

function paymentsFu30(han, ym, isDealer, tsumo) {
  let key = limitKey(han, ym);

  const b = key ? BASE_LIMIT[key] * (ym > 1 ? ym : 1) : 30 * Math.pow(2, 2 + han);

function payments(han, ym, isDealer, tsumo) {
  if (MODE.scoring === 'fu30') return paymentsFu30(han, ym, isDealer, tsumo);
  const key = limitKey(han, ym);
  const mult = ym > 1 ? ym : 1;
  if (key) {
    const L = LIMITS[key];
    if (!tsumo) return { ron: (isDealer ? L.ronD : L.ronC) * mult };
    if (isDealer) return { all: L.td * mult };
    return { child: L.tc[0] * mult, dealer: L.tc[1] * mult };
  }
  if (!tsumo) return { ron: isDealer ? RON_DEALER[han] : RON_CHILD[han] };
  if (isDealer) return { all: TSUMO_DEALER[han] };

}

  yakumanChipTsumo: null, // 役満チップ：ツモのときの1人あたり（null=ロンと同じ）
  openRiichi: false, openRiichiCost: 5000,
  ankanKokushi: false,  // 暗槓に対する国士無双の和了
  endBonus: null,       // 終了時の点数ボーナス [[下限点, 枚数], ...]（払うのは5万点未満のラス）
  agariYame: 'auto',    // 'auto'=トップならやめ / 'choice'=オーラスの親が和了ったら続けるか選ぶ
  drawToEnd: false,     // 王牌の補充牌までツモり切る
};
// 2つ目のルール（40,000点持ち・30符固定ツモ損あり など）
const RULESETS = {
  r2: {
    startPoints: 40000, returnPoints: 40000, oka: 0, uma: [0, 0, 0], length: 'hanchan',
    scoring: 'fu30', honbaRon: 2000, honbaTsumo: 1000, notenTotal: 6000,
    pocchi: false, emerald: true, bothX4: true, yakumanChip: 10, yakumanChipTsumo: 5,
    openRiichi: true, openRiichiCost: 5000, ankanKokushi: true, chiitoi4: true,
    endBonus: [[110000, 20], [100000, 18], [90000, 16], [80000, 14], [70000, 12], [60000, 8], [50000, 4]],
    agariYame: 'choice', drawToEnd: true,
  },
};

class Game {
  constructor(agents, opts, hooks, seed) {
    this.agents = agents;
    const rs = opts && opts.rules ? RULESETS[opts.rules] : null;
    this.opts = Object.assign({}, DEFAULT_OPTS, rs || {}, opts || {});
    setMode(this.opts);
    this.hooks = hooks || {};
    this.rng = makeRng(seed);
    this.players = [0, 1, 2].map(i => ({
      seat: i, points: this.opts.startPoints, chips: 0, name: agents[i].name || ('P' + i),
    }));
    this.round = 0;       // 0..2 東1-3, 3..5 南1-3
    // 起家はランダム（opts.startSeat で固定も可）
    this.startSeat = this.opts.startSeat != null ? this.opts.startSeat : Math.floor(this.rng() * 3);
    this.honba = 0;
    this.sticks = 0;
    this.lastRound = this.opts.length === 'tonpu' ? 2 : 5;
    this.log = [];
    this.ended = false;
  }
  get dealer() { return (this.startSeat + this.round) % 3; }
  get roundWind() { return 27 + Math.floor(this.round / 3); }
  seatWind(i) { return 27 + ((i - this.dealer + 3) % 3); }
  async emit(ev, data) { if (this.hooks.event) await this.hooks.event(ev, data, this); }
  async pause(ms) { if (this.hooks.pause) await this.hooks.pause(ms); }

  // 公開情報: 各種牌の見えている枚数（自分の手牌を含む）
  visibleCounts(seat) {
    const v = new Array(34).fill(0);
    const P = this.players;
    for (const t of P[seat].hand) v[t.k]++;
    for (const p of P) {
      for (const d of p.river) if (!d.called) v[d.tile.k]++;
      for (const m of p.melds) for (const t of m.tiles) v[t.k]++;
      v[NORTH] += p.nuki.length;
    }
    for (let i = 0; i < this.doraRevealed; i++) v[this.doraInd[i].k]++;
    return v;
  }

  // 手出し・ツモ切りから見た読みの特徴（公開情報のみ）
  // 末尾のツモ切り連続数（0〜3）
  tgStreak(j) {
    const r = this.players[j].river;
    let n = 0;
    for (let i = r.length - 1; i >= 0 && r[i].tsumogiri && n < 3; i--) n++;
    return n;
  }
  // 牌 k に対する相手 j の特徴。リーチ者：宣言牌が手出しか(T/t)と、その近く(m)。それ以外：ツモ切り連続(g0-3)と、直近の手出し牌の近く(n)
  readFeat(j, k) {
    const q = this.players[j];
    const near = (a, b) => a < 27 && b < 27 && a !== b && Math.floor(a / 9) === Math.floor(b / 9) && Math.abs(a - b) <= 2;
    if (q.riichi) {
      const d = q.river[q.riichiRiverIdx];
      if (!d) return 't';
      const ted = !d.tsumogiri;
      return (ted ? 'T' : 't') + (ted && near(k, d.tile.k) ? 'm' : '');
    }
    let last = null;
    for (let i = q.river.length - 1; i >= 0; i--) if (!q.river[i].tsumogiri) { last = q.river[i].tile.k; break; }
    return 'g' + this.tgStreak(j) + (last != null && near(k, last) ? 'n' : '');
  }
  tenFeat(j) { return this.players[j].riichi ? 'R' : 'g' + this.tgStreak(j); }

  doraIndKinds() { return this.doraInd.slice(0, this.doraRevealed).map(t => t.k); }
  uraIndKinds() { return this.uraInd.slice(0, this.doraRevealed).map(t => t.k); }

  setupHand() {
    const tiles = makeTiles(this.opts);
    for (let i = tiles.length - 1; i > 0; i--) {
      const j = Math.floor(this.rng() * (i + 1));
      [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
    }
    this.rinshan = tiles.splice(0, 4);
    this.doraInd = tiles.splice(0, 5);
    this.uraInd = tiles.splice(0, 5);
    this.doraRevealed = 1;
    for (const p of this.players) {
      p.hand = []; p.melds = []; p.river = []; p.nuki = []; p.pao = null;
      p.riichi = false; p.doubleRiichi = false; p.ippatsu = false; p.openRiichi = false;
      p.riichiFuriten = false; p.tempFuriten = false; p.firstTurn = true;
      p.discardKinds = new Set(); p.riichiRiverIdx = -1; p.drawn = null;
      p.safeAfterRiichi = new Set();
    }
    for (let r = 0; r < 13; r++) for (let i = 0; i < 3; i++) this.players[(this.dealer + i) % 3].hand.push(tiles.shift());
    for (const p of this.players) sortTiles(p.hand);
    this.wall = tiles; // 55枚
    this.noCalls = true;
    this.totalKans = 0;
    this.lastDiscard = null;
  }

  drawWall() { return this.wall.length ? this.wall.shift() : this.rinshan.shift(); }
  // まだツモれる枚数（ツモり切りルールでは補充牌も含む）
  live() { return this.wall.length + (this.opts.drawToEnd ? this.rinshan.length : 0); }
  drawRinshan() {
    const t = this.rinshan.shift();
    if (this.wall.length > 0) this.rinshan.push(this.wall.pop());
    return t;
  }

  // ---- 判定ユーティリティ ----
  meldN(p) { return p.melds.length; }
  handCounts(p) { return counts(p.hand); }
  waits(p) { const c = counts(p.hand); return waitsOf(c, p.melds.length); }
  isFuriten(p) {
    if (p.riichiFuriten || p.tempFuriten) return true;
    const w = this.waits(p);
    return w.some(k => p.discardKinds.has(k));
  }
  winCtx(p, winTile, opt) {
    const concealed = opt.tsumo ? p.hand.slice() : p.hand.concat([winTile]);
    return {
      concealed, melds: p.melds, winTile, tsumo: !!opt.tsumo,
      seatWind: this.seatWind(p.seat), roundWind: this.roundWind,
      riichi: p.riichi, doubleRiichi: p.doubleRiichi, openRiichi: p.openRiichi, ippatsu: p.ippatsu && (p.riichi),
      haitei: !!opt.haitei, houtei: !!opt.houtei, rinshan: !!opt.rinshan, chankan: !!opt.chankan,
      tenhou: !!opt.tenhou, chiihou: !!opt.chiihou,
      doraInd: this.doraIndKinds(), uraInd: this.uraIndKinds(), nukiCount: p.nuki.length,
    };
  }
  canTsumo(p, flags) {
    const c = counts(p.hand);
    if (!isAgariShape(c, p.melds.length)) return null;
    const ev = evaluateWin(this.winCtx(p, p.drawn, Object.assign({ tsumo: true }, flags)));
    return ev && ev.hasYaku ? ev : null;
  }
  canRon(p, tile, flags) {
    const c = counts(p.hand); c[tile.k]++;
    if (!isAgariShape(c, p.melds.length)) return null;
    if (this.isFuriten(p)) return null;
    const ev = evaluateWin(this.winCtx(p, tile, Object.assign({ tsumo: false }, flags)));
    return ev && ev.hasYaku ? ev : null;
  }
  // 白ポッチ：リーチ後にツモったときだけ、いちばん高くなる牌として扱う
  pocchiTsumo(p, flags) {
    const base = p.hand.filter(t => t !== p.drawn);
    const cb = counts(base);
    let best = null, bestV = -1;
    for (const k of KINDS) {
      if (cb[k] >= 4) continue;
      const sub = { id: p.drawn.id, k, red: false, gold: false, pocchi: true, emeraldSub: !!p.drawn.emerald };
      cb[k]++;
      const ok = isAgariShape(cb, p.melds.length);
      cb[k]--;
      if (!ok) continue;
      const ctx = this.winCtx(p, sub, Object.assign({ tsumo: true }, flags));
      ctx.concealed = base.concat([sub]);
      const ev = evaluateWin(ctx);
      if (!ev || !ev.hasYaku) continue;
      const pay = payments(ev.han, ev.ym, p.seat === this.dealer, true);
      const tot = pay.all != null ? pay.all * 2 : pay.child + pay.dealer;
      const v = tot + (ev.kin + ev.ura + (ev.ym ? 10 * ev.ym : 0)) * 5000;
      if (v > bestV) { bestV = v; best = ev; best.pocchiAs = k; best.pocchiEmerald = !!p.drawn.emerald; }
    }
    return best;
  }

  // 自分の手番でできること
  turnOptions(p, ctx) {
    const o = { tsumo: null, nuki: false, ankan: [], kakan: [], riichi: [], discardable: [] };
    const canRinshan = this.rinshan.length > 0;
    if (!ctx.afterCall) {
      o.tsumo = this.canTsumo(p, ctx.flags);
      if (p.riichi && p.drawn && ((this.opts.pocchi && p.drawn.pocchi) || (this.opts.emerald && p.drawn.emerald))) {
        const pe = this.pocchiTsumo(p, ctx.flags);
        if (pe && (!o.tsumo || pe.ym > o.tsumo.ym || (pe.ym === o.tsumo.ym && pe.han > o.tsumo.han))) o.tsumo = pe;
      }
      if (p.riichi && o.tsumo == null) {
        // 立直中に和了を見逃すとフリテン扱いはhuman側で処理
      }
      const hasNorth = p.hand.some(t => t.k === NORTH);
      o.nuki = hasNorth && canRinshan;
      const c = counts(p.hand);
      if (canRinshan && this.live() > 0 && this.totalKans < 4) {
        for (let k = 0; k < 34; k++) {
          if (c[k] === 4 && k !== NORTH) {
            if (p.riichi) {
              if (p.drawn && p.drawn.k === k) {
                const before = c.slice(); before[k]--;
                const w1 = waitsOf(before, p.melds.length).join(',');
                const after = c.slice(); after[k] = 0;
                const w2 = waitsOf(after, p.melds.length + 1).join(',');
                if (w1 === w2 && w1.length) o.ankan.push(k);
              }
            } else o.ankan.push(k);
          }
        }
        if (!p.riichi) for (const m of p.melds) if (m.type === 'pon' && c[m.k] >= 1) o.kakan.push(m.k);
      }
    }
    // 打牌可能牌
    let disc;
    if (p.riichi && !ctx.afterCall) disc = p.drawn && p.drawn.k !== NORTH ? [p.drawn] : (p.drawn ? [p.drawn] : []);
    else {
      disc = p.hand.filter(t => t.k !== NORTH && !(ctx.forbidKind != null && t.k === ctx.forbidKind));
      if (disc.length === 0) disc = p.hand.slice();
    }
    if (p.riichi && !ctx.afterCall && p.drawn && p.drawn.k === NORTH && o.nuki) disc = [];
    o.discardable = disc;
    o.openRiichi = [];
    // 立直
    if (!p.riichi && !ctx.afterCall && p.melds.every(m => m.type === 'ankan') && p.points >= 1000 && this.live() >= 3) {
      const seen = new Set();
      for (const t of disc) {
        if (seen.has(t.k)) continue;
        seen.add(t.k);
        const c = counts(p.hand); c[t.k]--;
        if (shanten(c, p.melds.length) === 0) o.riichi.push(t.k);
      }
      // オープン立直（供託5,000点）
      if (this.opts.openRiichi && p.points >= this.opts.openRiichiCost) o.openRiichi = o.riichi.slice();
    }
    return o;
  }

  // 同種の牌から実際に捨てる1枚（赤より金を残す、通常牌優先）
  pickTileOfKind(p, k, preferId) {
    if (preferId != null) { const t = p.hand.find(x => x.id === preferId); if (t) return t; }
    const ts = p.hand.filter(t => t.k === k);
    ts.sort((a, b) => (a.gold - b.gold) || (a.red - b.red));
    return ts[0];
  }
  removeFromHand(p, tile) { const i = p.hand.indexOf(tile); if (i >= 0) p.hand.splice(i, 1); }

  revealKanDora() { if (this.doraRevealed < 5) this.doraRevealed++; }
  breakIppatsu() { for (const p of this.players) p.ippatsu = false; }

  // ---- 1局 ----
  async playHand() {
    this.setupHand();
    const P = this.players;
    await this.emit('handStart', {});
    let cur = this.dealer;
    let mode = 'draw';        // 'draw' | 'rinshan' | 'rinshanNuki' | 'afterCall'
    let forbidKind = null;
    while (true) {
      const p = P[cur];
      const agent = this.agents[cur];
      let flags = {};
      if (mode !== 'afterCall') {
        let tile;
        if (mode === 'draw') {
          if (this.live() === 0) return await this.exhaustiveDraw();
          tile = this.drawWall();
          flags.haitei = this.live() === 0;
        } else {
          tile = this.drawRinshan();
          flags.rinshan = true; // カン・北抜きの補充牌で和了なら嶺上開花
        }
        p.hand.push(tile);
        p.drawn = tile;
        if (p.firstTurn && this.noCalls && mode === 'draw') {
          if (cur === this.dealer) flags.tenhou = true; else flags.chiihou = true;
        }
        await this.emit('draw', { seat: cur, tile });
      }
      const ctx = { afterCall: mode === 'afterCall', flags, forbidKind };
      const opts = this.turnOptions(p, ctx);
      let act = await agent.onTurn(this, cur, opts, ctx);
      act = this.sanitizeTurnAction(p, opts, act);
      if (act.type === 'tsumo') {
        return await this.finishWins([await this.settleWin(cur, null, opts.tsumo, p.drawn, true, true)]);
      }
      // 和了を見逃した立直はフリテン（エメラルド北ポッチを抜いた場合はフリテンにしない）
      if (p.riichi && opts.tsumo && act.type !== 'tsumo' && !(act.type === 'nuki' && p.drawn && p.drawn.emerald && this.opts.emerald)) p.riichiFuriten = true;
      if (act.type === 'nuki') {
        const t = p.hand.find(x => x.k === NORTH);
        this.removeFromHand(p, t);
        p.nuki.push(t);
        sortTiles(p.hand);
        p.drawn = null;
        // 北抜きで一発・ダブル立直（第一巡の鳴きなし扱い）は消える
        this.noCalls = false; this.breakIppatsu();
        await this.emit('nuki', { seat: cur, tile: t });
        if (p.nuki.length === 4 && this.opts.nuki4Chip) {
          const n = this.opts.nuki4Chip;
          for (let i = 0; i < 3; i++) if (i !== cur) { this.players[i].chips -= n; p.chips += n; }
          await this.emit('nuki4', { seat: cur, chip: n });
        }
        mode = 'rinshanNuki';
        continue;
      }
      if (act.type === 'ankan') {
        const ts = p.hand.filter(t => t.k === act.k);
        if (this.opts.ankanKokushi) {
          const t0 = ts[0], kRons = [];
          for (let d = 1; d <= 2; d++) {
            const j = (cur + d) % 3, q = P[j];
            const ev = this.canRon(q, t0, { chankan: true });
            if (ev && ev.yaku.some(y => y.name === '国士無双')) {
              const r = await this.agents[j].onCall(this, j, t0, cur, { ron: ev, pon: false, minkan: false, chankan: true });
              if (r && r.type === 'ron') { kRons.push({ j, ev }); continue; }
              q.tempFuriten = true; if (q.riichi) q.riichiFuriten = true;
            }
          }
          if (kRons.length) {
            const rs = [];
            for (let x = 0; x < kRons.length; x++) rs.push(await this.settleWin(kRons[x].j, cur, kRons[x].ev, t0, false, x === 0));
            return await this.finishWins(rs);
          }
        }
        for (const t of ts) this.removeFromHand(p, t);
        p.melds.push({ type: 'ankan', k: act.k, tiles: ts, from: cur });
        this.totalKans++; this.noCalls = false; this.breakIppatsu();
        sortTiles(p.hand); p.drawn = null;
        this.revealKanDora();
        await this.emit('kan', { seat: cur, type: 'ankan', k: act.k });
        mode = 'rinshan';
        continue;
      }
      if (act.type === 'kakan') {
        const t = p.hand.find(x => x.k === act.k);
        // 槍槓
        const ckRons = [];
        for (let d = 1; d <= 2; d++) {
          const j = (cur + d) % 3;
          const q = P[j];
          const ev = this.canRon(q, t, { chankan: true });
          if (ev) {
            const r = await this.agents[j].onCall(this, j, t, cur, { ron: ev, pon: false, minkan: false, chankan: true });
            if (r && r.type === 'ron') { ckRons.push({ j, ev }); continue; }
          }
          if (this.waits(q).includes(t.k)) { q.tempFuriten = true; if (q.riichi) q.riichiFuriten = true; }
        }
        if (ckRons.length) {
          const rs = [];
          for (let x = 0; x < ckRons.length; x++) rs.push(await this.settleWin(ckRons[x].j, cur, ckRons[x].ev, t, false, x === 0));
          return await this.finishWins(rs);
        }
        this.removeFromHand(p, t);
        const m = p.melds.find(x => x.type === 'pon' && x.k === act.k);
        m.type = 'kakan'; m.tiles.push(t); m.addedTile = t;
        this.totalKans++; this.noCalls = false; this.breakIppatsu();
        sortTiles(p.hand); p.drawn = null;
        this.revealKanDora();
        await this.emit('kan', { seat: cur, type: 'kakan', k: act.k });
        mode = 'rinshan';
        continue;
      }
      // 打牌
      const tile = act.tile;
      const declaringRiichi = act.type === 'riichi' || act.type === 'openRiichi';
      const declaringOpen = act.type === 'openRiichi';
      this.removeFromHand(p, tile);
      sortTiles(p.hand);
      const tsumogiri = p.drawn === tile;
      p.drawn = null;
      if (p.riichi && p.ippatsu && p.riichiRiverIdx !== p.river.length) p.ippatsu = false;
      const entry = { tile, tsumogiri, riichi: declaringRiichi, called: false };
      p.river.push(entry);
      p.discardKinds.add(tile.k);
      p.tempFuriten = false;
      const wasFirst = p.firstTurn;
      p.firstTurn = false;
      if (declaringRiichi) {
        p.riichiPending = true;
        p.doubleRiichi = wasFirst && this.noCalls;
      }
      this.lastDiscard = { seat: cur, tile };
      await this.emit('discard', { seat: cur, tile, riichi: declaringRiichi, open: declaringOpen, tsumogiri });
      for (const q of P) if (q.riichi && q !== p) q.safeAfterRiichi.add(tile.k);
      forbidKind = null;

      // 他家の反応
      const houtei = this.live() === 0;
      const rons = [];
      const calls = [];
      for (let d = 1; d <= 2; d++) {
        const j = (cur + d) % 3;
        const q = P[j];
        const ev = this.canRon(q, tile, { houtei });
        const c = counts(q.hand);
        const canPon = !q.riichi && c[tile.k] >= 2 && this.live() > 0;
        const canMinkan = !q.riichi && c[tile.k] >= 3 && this.live() > 0 && this.rinshan.length > 0 && this.totalKans < 4;
        let resp = { type: 'pass' };
        if (ev || canPon || canMinkan) {
          resp = await this.agents[j].onCall(this, j, tile, cur, { ron: ev, pon: canPon, minkan: canMinkan }) || { type: 'pass' };
        }
        if (resp.type === 'ron' && ev) {
          rons.push({ j, ev });
        } else {
          if (this.waits(q).includes(tile.k)) { q.tempFuriten = true; if (q.riichi) q.riichiFuriten = true; }
          if ((resp.type === 'pon' && canPon) || (resp.type === 'minkan' && canMinkan)) calls.push({ j, type: resp.type });
        }
      }
      if (rons.length) {
        if (declaringRiichi) { p.riichiPending = false; }
        const rs = [];
        for (let x = 0; x < rons.length; x++) rs.push(await this.settleWin(rons[x].j, cur, rons[x].ev, tile, false, x === 0));
        return await this.finishWins(rs);
      }
      if (declaringRiichi) {
        p.riichiPending = false;
        p.riichi = true; p.ippatsu = true; p.riichiRiverIdx = p.river.length - 1;
        const cost = declaringOpen ? this.opts.openRiichiCost : 1000;
        p.openRiichi = declaringOpen;
        p.points -= cost; this.sticks += cost / 1000;
        await this.emit('riichi', { seat: cur, open: declaringOpen });
      }
      if (calls.length) {
        const call = calls[0];
        const q = P[call.j];
        entry.called = true;
        this.noCalls = false; this.breakIppatsu();
        const need = call.type === 'pon' ? 2 : 3;
        const own = [];
        // 赤/金も含め手牌から取る（金・赤は手元に残したまま鳴いても打点は変わらないので順番は問わない）
        for (const t of q.hand.filter(x => x.k === tile.k)) { if (own.length < need) own.push(t); }
        for (const t of own) this.removeFromHand(q, t);
        q.melds.push({ type: call.type === 'pon' ? 'pon' : 'minkan', k: tile.k, tiles: own.concat([tile]), from: cur, calledTile: tile });
        // パオ（責任払い）：三元牌の3つ目・風牌の4つ目の副露を鳴かせた人
        if (this.opts.pao && !q.pao) {
          const isD = k => k >= 31 && k <= 33, isW = k => k >= 27 && k <= 30;
          if (isD(tile.k) && q.melds.filter(m => isD(m.k)).length === 3) q.pao = { seat: cur, yaku: '大三元' };

  let v = H[0][js + '|' + cat + '|' + feat]; if (v != null) return v;
  v = H[1][sp + '|' + cat + '|' + feat]; if (v != null) return v;
  v = H[2][sp + '|' + cat]; if (v != null) return v;
  const b = cat.replace(/[duK]/g, '');
  v = H[3][(sp === 'R' ? 'R' : 'O') + '|' + b]; if (v != null) return v;
  v = H[4][b]; return v != null ? v : 0.02;
}
function tenProb(js, tf) {

  let v = T[0][js + '|' + tf]; if (v != null) return v;
  v = T[1][js]; if (v != null) return v;
  const w = T[2][js.split('|')[0]]; return w != null ? w : 0.1;
}
function lossLookup(game, j, dk) {
  const q = game.players[j];
  const dealer = j === game.dealer ? 1 : 0;
  const Ls = LT4.loss;
  let key;
  if (q.riichi) key = 'R|' + dealer + '|0';
  else {
    let vd = q.nuki.length;
    for (const m of q.melds) for (const t of m.tiles) if (t.red || t.gold || dk.includes(t.k)) vd++;
    key = 'o' + Math.min(3, q.melds.filter(m => m.type !== 'ankan').length) + '|' + dealer + '|' + Math.min(4, vd);
  }
  let v = Ls[0][key]; if (v != null) return v;
  v = Ls[1][key.split('|').slice(0, 2).join('|')]; if (v != null) return v;
  return Ls[2][q.riichi ? 'R' : 'O'] || 800;
}
function gainLookup(mode, yh, d, dealer) {
  const Gt = LT4.gain;
  const dd = Math.min(8, Math.max(0, Math.round(d)));
  let v = Gt[0][mode + '|' + (mode === 'R' ? 0 : yh) + '|' + dd + '|' + dealer]; if (v != null) return v;
  v = Gt[1][mode + '|' + dd + '|' + dealer]; if (v != null) return v;
  // データが少ない高ドラはドラ1枚ごとに伸ばす
  for (let x = dd - 1; x >= 0; x--) { const b = Gt[1][mode + '|' + x + '|' + dealer]; if (b != null) return b * Math.pow(1.35, dd - x); }
  return Gt[2][mode + '|' + dealer] || 800;
}

// ---- 相手の脅威 ----
function threatLevel(game, seat, j) {
  if (j === seat) return 0;
  const q = game.players[j];
  if (q.riichi) return 1;
  const open = q.melds.filter(m => m.type !== 'ankan').length;
  const turn = q.river.length;
  if (open >= 3) return 0.85;
  if (open === 2) return turn >= 6 ? 0.6 : 0.4;
  if (open === 1) return turn >= 9 ? 0.35 : 0.15;
  return turn >= 12 ? 0.2 : turn >= 8 ? 0.08 : 0;
}
function lossYen(game, seat, j, P) {
  const q = game.players[j];
  const dk = doraKinds(game);
  const dealer = j === game.dealer ? 1.5 : 1;
  if (q.riichi) return (P.riichiLossPt * dealer + q.nuki.length * 1500) * PT + P.riichiLossChip * CHIP;
  let vis = q.nuki.length;
  let gold = 0;
  let mul = 1;
  for (const m of q.melds) for (const t of m.tiles) { if (dk.includes(t.k)) vis++; if (t.red) vis++; if (t.gold) { vis++; gold++; } if (t.crystal) mul = 2; }
  // 鳴いた牌にクリスタル一萬が見えていれば打点2倍
  return (P.openLossPt * dealer * (1 + 0.35 * vis)) * PT * mul + gold * CHIP;
}

function dangerOf(game, seat, k, j, vis) {
  const q = game.players[j];
  const safe = x => q.discardKinds.has(x) || (q.riichi && q.safeAfterRiichi.has(x));
  if (safe(k)) return 0;
  const unseen = 4 - vis[k];
  let d;
  const noSeq = k >= 27 || k === 0 || k === 8;
  if (noSeq) {
    d = unseen <= 0 ? 0 : unseen === 1 ? 1.5 : unseen === 2 ? 4.5 : 6.5;
    if (k >= 27 && isYakuhaiFor(game, j, k)) d *= 1.2;
  } else {
    const r = k % 9 + 1;
    const base = (r === 1 || r === 9) ? 6 : (r === 2 || r === 8) ? 8 : (r === 3 || r === 7) ? 10 : 12;
    let sujiFull = false, sujiHalf = false;
    if (r <= 3) sujiFull = safe(k + 3);
    else if (r >= 7) sujiFull = safe(k - 3);
    else { const a = safe(k - 3), b = safe(k + 3); sujiFull = a && b; sujiHalf = a !== b; }
    d = base;
    if (sujiFull) d = (r === 1 || r === 9) ? 2.5 : (r === 2 || r === 8) ? 3 : (r === 3 || r === 7) ? 3.5 : 4;
    else if (sujiHalf) d = 8;
    const blocked = x => vis[x] >= 4;
    let lowSide = r >= 3 && !(blocked(k - 1) || blocked(k - 2));
    let highSide = r <= 7 && !(blocked(k + 1) || blocked(k + 2));
    if (!lowSide && !highSide && !sujiFull) d = Math.min(d, unseen <= 1 ? 2 : 4);
    if (unseen === 0) d = Math.min(d, 1.5);
  }
  const dk = doraKinds(game);
  if (dk.includes(k) || k === S.P5 || k === S.S5) d *= 1.3;
  return d;
}

// ---- 和了率の見積もり（学習済みテーブル） ----
function wrLookup(s, u, T, open, oppR, selfR) {
  if (s > 0) {
    // 受け入れ枚数のバケツ間を線形補間する
    const x = u / 6 - 0.5;
    const b0 = Math.max(0, Math.min(10, Math.floor(x))), b1 = Math.min(10, b0 + 1);
    const f = Math.max(0, Math.min(1, x - b0));
    return (1 - f) * wrBucket(s, b0, T, open, oppR, selfR) + f * wrBucket(s, b1, T, open, oppR, selfR);
  }
  return wrBucket(s, Math.min(u, 12), T, open, oppR, selfR);
}
function wrBucket(s, ub, T, open, oppR, selfR) {
  const W = WR;
  if (s < 0) return 1;
  const ss = Math.min(s, 4);
  const t = Math.min(T, 18);
  const f = W.F[ss + '|' + ub + '|' + t + '|' + open + '|' + oppR + '|' + selfR];
  if (f != null) return f;
  const m = W.M[ss + '|' + ub + '|' + Math.floor(t / 3) + '|' + oppR];
  if (m != null) return m;
  const c = W.C[ss + '|' + Math.floor(t / 3)];
  return c != null ? c : 0;
}

// s向聴から、ツモ n 回のうちに和了まで届く確率（段階ごとの到達をDPで）
function winProb(s, qImp, qWin, n, decay) {
  if (s < 0) return 1;
  const st = new Float64Array(s + 2);
  st[0] = 1;
  for (let t = 0; t < n; t++) {
    for (let i = s; i >= 0; i--) {
      const q = i === s ? qWin : qImp * Math.pow(decay, i);
      const mv = st[i] * Math.min(0.95, q);
      st[i] -= mv; st[i + 1] += mv;
    }
  }
  return st[s + 1];
}

class CpuAgent {
  constructor(name, params) {
    this.name = name;
    this.P = Object.assign({}, DEFAULT_PARAMS, params || {});
  }

  // 13枚（または副露後）の状態の価値を見積もる
  // tiles: 手牌, melds: 副露, opt: { canRiichi }
  stateEval(game, seat, tiles, melds, ctx) {
    const P = this.P;
    const p = game.players[seat];
    const meldN = melds.length;
    const menzen = melds.every(m => m.type === 'ankan');
    const c = counts(tiles);
    const s = shanten(c, meldN);
    const { rem } = ctx;
    const unseen = ctx.unseen;
    const T = Math.max(0, Math.floor(game.wall.length / 3));
    const dk = ctx.dk;
    // ドラ・赤・金・抜き
    let dora = p.nuki.length * (1 + dk.filter(d => d === NORTH).length);
    let gold = 0, crystal = false, platinum = false;
    const all = melds.length ? tiles.concat(melds.flatMap(m => m.tiles)) : tiles;
    for (const t of all) {
      for (const d of dk) if (d === t.k) dora++;
      if (t.red) dora++;
      if (t.gold) { dora++; gold++; }
      if (t.crystal) crystal = true;
      if (t.platinum) platinum = true;
    }
    let yakuHan = 0, hasYaku = menzen;
    for (const m of melds) if (isYakuhaiFor(game, seat, m.k)) { yakuHan++; hasYaku = true; }
    for (let k = 27; k < 34; k++) if (c[k] >= 3 && isYakuhaiFor(game, seat, k)) { yakuHan++; hasYaku = true; }
    if (!hasYaku) {
      // 鳴き手の役の見込み
      let non = 0; for (let k = 0; k < 34; k++) if (c[k] && !isSimple(k) && k !== NORTH) non += c[k];
      if (non <= 1 && melds.every(m => isSimple(m.k))) { yakuHan += non === 0 ? 1 : 0.6; hasYaku = true; }
      for (const base of [9, 18]) {
        const inSuit = x => (x >= base && x < base + 9) || x >= 27;
        if (!melds.every(m => inSuit(m.k))) continue;
        let off = 0; for (let k = 0; k < 34; k++) if (c[k] && !inSuit(k)) off += c[k];
        if (off <= 2) { yakuHan += off === 0 ? 2 : 1.2; hasYaku = true; }
      }
      for (let k = 27; k < 34; k++) if (c[k] === 2 && isYakuhaiFor(game, seat, k)) { yakuHan += 0.5; hasYaku = true; }
    }
    // 待ち
    let qWin, waitsN = 0, exact = null, exactYh = null;
    if (s === 0) {
      const ws = waitsOf(c, meldN);
      let sumHan = 0, nY = 0, sumYh = 0;
      for (const w of ws) {
        const r = rem[w];
        if (r <= 0) continue;
        const fake = { id: -1, k: w, red: false, gold: false };
        const ev = evaluateWin({
          concealed: tiles.concat([fake]), melds, winTile: fake, tsumo: false,
          seatWind: game.seatWind(seat), roundWind: game.roundWind,
          doraInd: game.doraIndKinds(), uraInd: [], nukiCount: p.nuki.length,
        });
        if (ev && ev.hasYaku) { waitsN += r; sumHan += r * ev.han; sumYh += r * (ev.ym ? 3 : ev.yakuHan); nY += r; }
        else if (menzen) { waitsN += r; sumHan += r * (dora); nY += r; }
      }
      if (nY) { exact = sumHan / nY; exactYh = sumYh / nY; }
      qWin = waitsN / unseen * P.ronMult;
    } else {
      qWin = P.estWait / unseen * P.ronMult;
    }
    // 有効牌
    let uk = 0;
    if (s > 0) {
      for (const k of KINDS) {
        if (rem[k] <= 0 || c[k] >= 4) continue;
        c[k]++;
        if (shanten(c, meldN) < s) uk += rem[k];
        c[k]--;
      }
    }
    // 1向聴：2手先（テンパイしたときの待ちの広さ）を見る
    let look = 1;
    if (s === 1 && P.look2 > 0 && uk > 0) {
      const avgW = this.tenpaiWaits(c, meldN, rem);
      if (avgW != null) {
        const T1 = Math.max(0, T - 2);
        const a = wrBucket(0, Math.min(12, Math.round(avgW)), T1, menzen ? 0 : 1, ctx.oppR, 0);
        const b = wrBucket(0, Math.min(12, Math.round(P.look2Ref)), T1, menzen ? 0 : 1, ctx.oppR, 0);
        if (a > 0 && b > 0) look = Math.max(0.5, Math.min(1.6, Math.pow(a / b, P.look2)));
      }
    }
    const willRiichi = menzen && p.points >= 1000;
    const isDealer = seat === game.dealer ? 1 : 0;
    let mode = menzen ? (willRiichi ? 'R' : 'D') : 'O';
    let yh = menzen ? 0 : Math.min(3, Math.round(yakuHan));
    if (exactYh != null && mode !== 'R') yh = Math.min(3, Math.round(exactYh));
    let V = gainLookup(mode, yh, dora, isDealer);
    // クリスタル一萬（打点2倍）・プラチナ九萬（チップ2倍）・金2枚（+2枚）
    if (crystal) V *= 1.9;
    if (gold >= 2) V += 2 * CHIP;
    if (platinum) V += (gold + (gold >= 2 ? 2 : 0) + 0.5) * CHIP;
    const han = dora + (mode === 'R' ? 1 : yh);
    V += (game.sticks * 1000 + game.honba * 1000) * PT;
    if (isDealer) V += P.dealerBonusYen;
    else V += P.flowYen;
    V += ctx.blockYen + this.orasuWinYen(game, seat, V, ctx);
    if (!menzen && !hasYaku) V = 0;
    const oppR = ctx.oppR;
    const pw = (menzen || hasYaku || s === 0) ? Math.min(0.97, look * wrLookup(s, s === 0 ? waitsN : uk, T, menzen ? 0 : 1, oppR, s === 0 && willRiichi ? 1 : 0)) : 0;
    // 流局までもつれたときのテンパイ料と、親なら連荘の価値
    const tenpaiV = s === 0 ? (1 - pw) * 0.45 * (P.tenpaiYen + (isDealer ? P.dealerBonusYen : 0)) : 0;
    return { s, uk, pw, V, ev: pw * V + tenpaiV, waitsN, han, menzen };
  }

  // 1向聴の形 c から、有効牌を引いて最善の打牌をしたときの待ち枚数（有効牌の枚数で加重平均）
  tenpaiWaits(c, meldN, rem) {
    let wsum = 0, nsum = 0;
    for (const k of KINDS) {
      if (rem[k] <= 0 || c[k] >= 4) continue;
      c[k]++;
      if (shanten(c, meldN) === 0) {
        let best = 0;
        for (const d of KINDS) {
          if (!c[d] || d === k) continue;
          c[d]--;
          if (shanten(c, meldN) === 0) {
            let w = 0;
            for (const x of waitsOf(c, meldN)) w += Math.max(0, rem[x] - (x === k ? 1 : 0)) * (x === d ? 0 : 1);
            if (w > best) best = w;
          }
          c[d]++;
        }
        wsum += rem[k] * best; nsum += rem[k];
      }
      c[k]--;
    }
    return nsum ? wsum / nsum : null;
  }

  makeCtx(game, seat) {
    const { rem, vis } = remainingCounts(game, seat);
    let unseen = 0; for (const k of KINDS) unseen += rem[k];
    const dk = doraKinds(game);
    const js = [0, 1, 2].map(j => j === seat ? null : jStateKey(game, j));
    const threats = [0, 1, 2].map(j => j === seat ? 0 : tenProb(js[j], game.tenFeat(j)));
    // 親に放銃すると相手の連荘も付いてくる
    const losses = [0, 1, 2].map(j => j === seat ? 0 : lossLookup(game, j, dk) + (j === game.dealer ? this.P.dealerBonusYen / 2 : 0));
    let blockYen = 0;
    for (let j = 0; j < 3; j++) blockYen += threats[j] * losses[j] * this.P.blockBonus;
    const oppR = game.players.some((q, j) => j !== seat && q.riichi) ? 1 : 0;
    // オーラスでトップのとき：逆転される確率と、放銃で逆転される分のオカ
    let overtake = 0;
    if (this.P.orasu && game.round === game.lastRound) {
      const me = game.players[seat].points;
      const top = [0, 1, 2].every(j => j === seat || me > game.players[j].points);
      if (top) {
        for (let j = 0; j < 3; j++) {
          if (j === seat) continue;
          const lead = me - game.players[j].points;
          const m = Math.max(2000, losses[j] / PT); // 相手の和了の大きさの目安（点）
          const pRon = Math.exp(-lead / (2 * m)); // 自分から直撃なら差は2倍縮む
          const pOther = 0.5 * Math.exp(-lead / (1.5 * m)) + 0.5 * Math.exp(-lead / m);
          overtake += Math.min(1, threats[j]) * 0.5 * pOther;
          losses[j] += this.P.orasu * OKA_YEN * pRon;
        }
        overtake = Math.min(1, overtake);
      }
    }
    return { rem, vis, unseen: Math.max(unseen, 1), threats, losses, js, blockYen, dk, oppR, overtake };
  }

  // オーラスの着順：和了でトップに届く（または守れる）ことの価値（円）
  orasuWinYen(game, seat, V, ctx) {
    const P = this.P;
    if (!P.orasu || game.round !== game.lastRound) return 0;
    const me = game.players[seat].points;
    let top = -1;
    for (let j = 0; j < 3; j++) if (j !== seat && (top < 0 || game.players[j].points > game.players[top].points)) top = j;
    const gap = game.players[top].points - me;
    if (gap < 0) return P.orasu * OKA_YEN * ctx.overtake;
    const w = Math.max(1000, V / PT);
    const tr = P.tsumoRate, ronEach = (1 - tr) / 2;
    let p = 0;
    if (2 * w > gap) p += ronEach;   // トップから直撃
    if (w > gap) p += ronEach;       // 3番手から
    if (1.5 * w > gap) p += tr;      // ツモ（トップは約半分を払う）
    return P.orasu * OKA_YEN * p;
  }

  riskYen(game, seat, k, ctx) {
    let r = 0;
    for (let j = 0; j < 3; j++) {
      if (j === seat) continue;
      // オープン立直の相手は待ちが見えている：待ち牌なら確実に当たり、それ以外は安全
      const q = game.players[j];
      if (q.openRiichi) { if (!q.riichiFuriten && game.waits(q).includes(k)) r += ctx.losses[j] * 1.2; continue; }
      r += hitProb(ctx.js[j], tileCat(game, k, j, ctx.vis, ctx.dk), game.readFeat(j, k)) * this.P.dangerCalib * ctx.losses[j];
    }
    return r;
  }

  chooseDiscard(game, seat, tiles, melds, discardable, ctx) {
    const P = this.P;
    const seen = new Set();
    const cands = [];
    let riskSum = 0, riskN = 0;
    for (const t0 of discardable) {
      const key = t0.k * 8 + (t0.crystal ? 4 : t0.platinum ? 3 : t0.gold ? 2 : t0.red ? 1 : 0);
      if (seen.has(key)) continue;
      seen.add(key);
      const rest = tiles.filter(x => x !== t0);
      const st = this.stateEval(game, seat, rest, melds, ctx);
      const risk = this.riskYen(game, seat, t0.k, ctx);
      riskSum += risk; riskN++;
      cands.push({ tile: t0, st, risk });
    }
    const avgRisk = riskN ? riskSum / riskN : 0;
    const minS = Math.min(...cands.map(c => c.st.s));
    let bestMinEv = 0;
    for (const c of cands) if (c.st.s === minS && c.st.ev > bestMinEv) bestMinEv = c.st.ev;
    for (const c of cands) {
      // 押し続ける場合の将来の放銃リスク（遠い手ほど大きい）
      const fut = P.futureRisk * avgRisk * Math.min(4, c.st.s + 1) * (1 - c.st.pw);
      c.attack = c.st.ev - c.risk - fut;
      // 向聴を戻すのは、期待値が十分に上回るときだけ
      if (c.st.s > minS && c.st.ev < bestMinEv * (1 + P.breakMargin)) c.attack -= bestMinEv;
      c.fold = -c.risk;
      c.score = Math.max(c.attack, c.fold) + c.st.uk * 0.01 - (c.tile.gold ? 1 : 0) - (c.tile.red ? 0.5 : 0) - (c.tile.crystal ? 2 : 0) - (c.tile.platinum ? 1 : 0);
    }
    cands.sort((a, b) => b.score - a.score);
    return cands;
  }

  onTurn(game, seat, opts, ctxTurn) {
    const p = game.players[seat];
    const P = this.P;
    if (opts.tsumo) return { type: 'tsumo' };
    const c = counts(p.hand);
    const meldN = p.melds.length;
    const menzen = p.melds.every(m => m.type === 'ankan');
    if (opts.nuki) {
      let yao = 0;
      for (const k of [0, 8, 9, 17, 18, 26, 27, 28, 29, 31, 32, 33]) if (c[k]) yao++;
      const kokushi = menzen && meldN === 0 && yao >= 9 && game.wall.length > 20;
      if (!kokushi || c[NORTH] >= 2 || p.riichi) return { type: 'nuki' };
    }
    if (p.riichi) {
      if (opts.ankan.length) return { type: 'ankan', k: opts.ankan[0] };
      if (opts.discardable.length) return { type: 'discard', tile: opts.discardable[0] };
      if (opts.nuki) return { type: 'nuki' };
    }
    const ctx = this.makeCtx(game, seat);
    const maxThreat = Math.max(...ctx.threats);
    const cands = this.chooseDiscard(game, seat, p.hand, p.melds, opts.discardable, ctx);
    const best = cands[0];
    // カン（ドラが増えるので、危険がなく形が崩れないなら）
    if (!ctxTurn.afterCall && (opts.ankan.length || opts.kakan.length) && maxThreat < 0.5) {
      const bestS = Math.min(...cands.map(x => x.st.s));
      for (const k of opts.ankan) {
        const c2 = c.slice(); c2[k] = 0;
        if (shanten(c2, meldN + 1) <= bestS) return { type: 'ankan', k };
      }
      for (const k of opts.kakan) {
        const c2 = c.slice(); c2[k]--;
        if (shanten(c2, meldN) <= bestS) return { type: 'kakan', k };
      }
    }
    // 立直判断：リーチとダマの期待値を比べる
    const rc = best.st.s === 0 && opts.riichi.includes(best.tile.k) ? best : null;
    if (rc) {
      const st = rc.st;
      if (st.waitsN > 0) {
        const T = Math.floor(game.wall.length / 3);
        const dama = this.damaValue(game, seat, rc.tile, ctx);
        const pwR = st.pw;
        const evR = pwR * st.V - (1 - pwR) * 100;
        const evD = dama ? Math.min(0.97, pwR * P.damaWinBoost) * dama : -Infinity;
        if (evR >= evD && T >= 1) return this.riichiAct(game, seat, opts, rc.tile);
        if (!dama) return this.riichiAct(game, seat, opts, rc.tile);
      }
    }
    return { type: 'discard', tile: best.tile };
  }

  // 立直のしかた：相手2人とも立直中（待ちを避けられない）ならオープン立直で1翻上げる
  riichiAct(game, seat, opts, tile) {
    const others = game.players.filter((q, j) => j !== seat);
    if ((opts.openRiichi || []).includes(tile.k) && others.every(q => q.riichi)) return { type: 'openRiichi', tile };
    return { type: 'riichi', tile };

  const row = (label, f) => `<tr><td>${label}</td>${S3.map(x => `<td class="r">${f(x)}</td>`).join('')}</tr>`;
  return `<div class="muted">3人の比較（${S3[0].games}半荘・${S3[0].hands}局）</div>
    <table class="rec cmp">
      <tr><td></td>${NAMES.map(n => `<td class="r"><b>${n}</b></td>`).join('')}</tr>
      ${row('累計収支', x => `<span class="${x.yen >= 0 ? 'plus' : 'minus'}">${yenFmt(x.yen)}</span>`)}
      ${row('1半荘平均', x => x.games ? yenFmt(Math.round(x.yen / x.games)) : '−')}
      ${row('順位', x => x.ranks.join('/'))}
      ${row('平均順位', x => x.games ? ((x.ranks[0] + x.ranks[1] * 2 + x.ranks[2] * 3) / x.games).toFixed(2) : '−')}
      ${row('スコア', x => (x.score > 0 ? '+' : '') + x.score)}
      ${row('チップ', x => (x.chips > 0 ? '+' : '') + x.chips + '枚')}
      ${row('和了率', x => pct(x.wins, x.hands))}
      ${row('放銃率', x => pct(x.dealIns, x.hands))}
      ${row('リーチ率', x => pct(x.riichi, x.hands))}
      ${row('ツモ率', x => pct(x.tsumo, x.wins))}
      ${row('平均打点', x => x.wins ? fmt(Math.round(x.winPts / x.wins)) : '−')}
      ${row('役満', x => x.yakuman + '回')}
    </table>
    <div class="muted">コンピュータの記録はこの版から取り始めています。あなたの上の累計はこれまで全部の対局です。</div>`;
}
function storeNote() { return `<p class="warn">この開き方では記録を保存できません（ファイルを直接開いた場合など）。ホーム画面のアプリ版やClaude内のページでは保存されます。</p>`; }
function openRecords(back) {
  const [L, R] = recordsHTML().split('<!--SPLIT-->');
  const m = showModal(`<h2>成績</h2>` + cols(L, (R || '') + `
    <button class="btn" type="button" id="recBack">戻る</button>
    <button class="btn alt" type="button" id="recReset">記録をリセット</button>`), true);
  $('recBack').onclick = () => { hideModal(); back(); };
  let armed = false;
  $('recReset').onclick = e => {
    if (!armed) { armed = true; e.target.textContent = 'もう一度押すとリセット'; return; }
    records = emptyRec(); saveRec(records); openRecords(back);
  };
}

// ---------- 表示 ----------
function announce(seat, text) {
  const host = seat === 0 ? $('river0') : seat === 1 ? $('pond1') : seat === 2 ? $('pond2') : $('center');
  const r = host.getBoundingClientRect();
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  const [bx, by] = toLocal(r.left + r.width / 2, r.top + r.height / 2);
  b.style.left = bx + 'px';
  b.style.top = by + 'px';
  document.body.appendChild(b);
  requestAnimationFrame(() => b.classList.add('show'));
  setTimeout(() => { b.classList.remove('show'); setTimeout(() => b.remove(), 250); }, 900);
}

// 副露：鳴いた牌は横向き。上家からは左端、下家からは右端。加槓は横向きの牌に重ねる。暗槓は両端が裏
function meldParts(m, owner) {
  const rel = (m.from - owner + 3) % 3; // 1:下家 2:上家
  const called = m.calledTile || m.tiles[m.tiles.length - 1];
  const own = S.sortTiles(m.tiles.filter(t => t !== called && t !== m.addedTile).slice());
  return { rel, called, own };
}
function meldHTML(m, owner, w) {
  if (m.type === 'ankan') return `<span class="meld">${tileHTML(null, { w, back: true })}${tileHTML(m.tiles[1], { w })}${tileHTML(m.tiles[2], { w })}${tileHTML(null, { w, back: true })}</span>`;
  const { rel, called, own } = meldParts(m, owner);
  const side = m.type === 'kakan'
    ? `<span class="kstack">${tileHTML(m.addedTile, { w, side: true })}${tileHTML(called, { w, side: true })}</span>`
    : tileHTML(called, { w, side: true });
  const parts = own.map(t => tileHTML(t, { w }));
  if (rel === 2) parts.unshift(side); else parts.push(side);
  return `<span class="meld">${parts.join('')}</span>`;
}
// 自分の副露：古いものほど右端（手牌から遠い）
function myMeldsHTML(p, w) {
  return p.melds.slice().reverse().map(m => meldHTML(m, 0, w)).join('');
}
function nukiHTML(p, w) {
  if (!p.nuki.length) return '';
  return `<span class="meld" title="抜き北">${p.nuki.map(t => tileHTML(t, { w })).join('')}</span>`;
}
function riverHTML(p) {
  return p.river.map(d => {
    const cls = [d.called ? 'called' : '', d.tile.id === lastDiscardId ? 'last' : '', d.tsumogiri ? 'tg' : ''].filter(Boolean).join(' ');
    return tileHTML(d.tile, { side: d.riichi, cls });
  }).join('');
}

// 左右の相手の副露（相手から見た向きで縦に並べる）
// 左右の相手の副露（相手から見た向き）。左の相手は牌の頭が卓の中央（右）を向き、右の相手は左を向く。
// 鳴いた牌は相手から見て横向き＝左の相手なら画面上向き、右の相手なら画面下向き
function vMeldHTML(m, owner) {
  const sideCls = owner === 2 ? 'cw' : '', upCls = owner === 1 ? 'flip' : '';
  const sd = t => tileHTML(t, { side: true, cls: sideCls });
  if (m.type === 'ankan') return `<span class="vmeld">${tileHTML(null, { back: true, side: true })}${sd(m.tiles[1])}${sd(m.tiles[2])}${tileHTML(null, { back: true, side: true })}</span>`;
  const { rel, called, own } = meldParts(m, owner);
  const up = m.type === 'kakan'
    ? `<span class="vkstack">${tileHTML(called, { cls: upCls })}${tileHTML(m.addedTile, { cls: upCls })}</span>`
    : tileHTML(called, { cls: upCls });
  const parts = own.map(sd);
  if (rel === 2) parts.unshift(up); else parts.push(up);
  return `<span class="vmeld">${parts.join('')}</span>`;
}
// 副露は手牌から外側へ新しい順、抜き北は副露の「上」（相手から見て卓の内側）に並べる
function vMeldsHTML(p, i) {
  const ms = p.melds.slice().reverse().map(m => vMeldHTML(m, i)).join('');
  const nk = p.nuki.length ? `<span class="vmeld vnk">${p.nuki.map(t => tileHTML(t, { side: true, cls: i === 2 ? 'cw' : '' })).join('')}</span>` : '';
  return ms || nk ? `<span class="vmelds"><span class="vms">${ms}</span>${nk}</span>` : '';
}
// 自分の副露：抜き北は副露の上の段
function myMeldBlock(p, w) {
  const nk = p.nuki.length ? `<span class="mrow">${nukiHTML(p, w)}</span>` : '';
  const ms = p.melds.length ? `<span class="mrow">${myMeldsHTML(p, w)}</span>` : '';
  return nk + ms;
}
function cardHTML(i) {
  const p = game.players[i];
  const tags = [];
  if (p.riichi) tags.push(`<span class="tag riichi">${p.openRiichi ? 'オープン' : 'リーチ'}</span>`);
  if (p.chips) tags.push(`<span class="tag chip">${p.chips > 0 ? '+' : ''}${p.chips}枚</span>`);
  const name = `<span class="nm">${p.name}</span>`;
  const head = i === 1 ? tags.join('') + name : name + tags.join('');
  const w = 'calc(var(--rw) * .95)';
  return `<div class="ph">${head}</div>${p.nuki.length ? `<div class="melds">${nukiHTML(p, w)}</div>` : ''}<div class="melds">${p.melds.slice().reverse().map(m => meldHTML(m, i, w)).join('')}</div>`;
}

function seatScore(i, cls) {
  const g = game, p = g.players[i];
  const turn = turnSeat === i ? ' turn' : '';
  const extra = `<span class="cchip">${p.chips > 0 ? '+' : ''}${p.chips}枚</span>`;
  return `<div class="cs ${cls}${turn}"><span class="wd${g.dealer === i ? ' dealer' : ''}">${S.WIND_NAME[g.seatWind(i)]}</span>${fmt(p.points)}${p.riichi ? '<span class="stick"></span>' : ''}${extra}</div>`;
}

function render() {
  if (!game || !game.players[0].hand) return;
  const g = game;
  for (const i of [1, 2]) {
    const c = $('card' + i);
    c.innerHTML = cardHTML(i);
    c.classList.toggle('turn', turnSeat === i);
    const n = g.players[i].hand.length;
    const op = g.players[i];
    const backs = op.openRiichi
      ? `<span class="bk">${S.sortTiles(op.hand.slice()).map(t => tileHTML(t, { side: true, cls: i === 2 ? 'cw' : '' })).join('')}</span>`
      : `<span class="bk">${Array.from({ length: n }, () => tileHTML(null, { back: true, side: true })).join('')}</span>`;
    const col = $('backs' + i);
    col.innerHTML = i === 2 ? backs + vMeldsHTML(g.players[i], i) : vMeldsHTML(g.players[i], i) + backs;
    // 副露が多くて卓からはみ出すときは、その列だけ牌を縮める
    col.style.setProperty('--ms', 1);
    const cs = getComputedStyle(col), kids = [...col.children], gap = parseFloat(cs.rowGap) || 0;
    // 画面を回していても正しく測れるよう、回転前の大きさ（offsetHeight）で測る
    const hs = kids.map(k => k.offsetHeight);
    const need = cs.flexDirection.startsWith('row') ? Math.max(0, ...hs) : hs.reduce((a, b) => a + b, 0) + gap * Math.max(0, kids.length - 1);
    const avail = col.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
    if (avail > 0 && need > avail) col.style.setProperty('--ms', (avail / need * 0.97).toFixed(3));
    $('river' + i).innerHTML = riverHTML(g.players[i]);
  }
  $('river0').innerHTML = riverHTML(g.players[0]);
  const rname = ['東', '南', '西'][Math.floor(g.round / 3)] + (g.round % 3 + 1) + '局';
  const dora = [];
  for (let i = 0; i < 5; i++) dora.push(i < g.doraRevealed ? tileHTML(g.doraInd[i]) : tileHTML(null, { back: true }));
  $('center').innerHTML = `<div class="rnd">${rname}</div>
    <div class="meta">残 ${g.live ? g.live() : g.wall.length}</div>
    <div class="dora">${dora.join('')}</div>
    <div class="meta">${g.honba}本場・供託${g.sticks}</div>
    ${seatScore(0, 'b')}${seatScore(2, 'l')}${seatScore(1, 'r')}`;
  $('wallinfo').innerHTML = '';
  // 自分
  const me = g.players[0];
  const tags = [];
  if (me.riichi) tags.push('<span class="tag riichi">リーチ</span>');
  tags.push(`<span class="tag chip">チップ ${me.chips > 0 ? '+' : ''}${me.chips}</span>`);
  $('meinfo').innerHTML = `${tags.join('')}<span class="melds">${myMeldBlock(me)}</span>`;
  renderHand();
  renderActions();
}

function renderHand() {
  const me = game.players[0];
  const drawn = me.drawn && me.hand.includes(me.drawn) ? me.drawn : null;
  const rest = S.sortTiles(me.hand.filter(t => t !== drawn).slice());
  const pt = pendingTurn;
  const can = new Set(pt ? pt.opts.discardable.map(t => t.id) : []);
  const riichiKinds = pt && riichiMode ? new Set(riichiMode === 'open' ? pt.opts.openRiichi : pt.opts.riichi) : null;
  const html = [];
  const one = t => {
    const cls = [];
    if (t.id === selectedId) cls.push('sel');
    if (pt && (!can.has(t.id) || (riichiKinds && !riichiKinds.has(t.k)))) cls.push('dim');
    return tileHTML(t, { id: t.id, cls: cls.join(' ') });
  };
  for (const t of rest) html.push(one(t));
  if (drawn) { html.push('<span class="gap"></span>'); html.push(one(drawn)); }
  if (me.melds.length || me.nuki.length) html.push(`<span class="mymelds">${myMeldBlock(me)}</span>`);
  $('hand').innerHTML = html.join('');
}

function waitsText(tiles, meldN) {
  const c = S.counts(tiles);
  if (S.shanten(c, meldN) !== 0) return null;
  const w = S.waitsOf(c, meldN);
  if (!w.length) return null;
  const { rem } = AI.remainingCounts(game, 0);
  return { w, txt: w.map(k => `${S.KIND_NAME[k]}<span style="opacity:.6">(${rem[k]})</span>`).join(' ') };
}

function renderActions() {
  const box = $('actions');
  const hint = $('hint');
  const btn = (label, cls, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'act ' + (cls || ''); b.textContent = label; b.onclick = fn; box.appendChild(b); };
  box.innerHTML = '';
  hint.innerHTML = '';
  const me = game.players[0];
  if (pendingCall) {
    const { o, tile } = pendingCall, d = pendingCall.done;
    if (o.ron) btn('ロン', 'red', () => d({ type: 'ron' }));
    if (o.pon) btn('ポン', '', () => d({ type: 'pon' }));
    if (o.minkan) btn('カン', '', () => d({ type: 'minkan' }));
    btn('スルー', 'ghost', () => d({ type: 'pass' }));
    hint.innerHTML = `${game.players[pendingCall.from].name}の <b>${S.KIND_NAME[tile.k]}</b>`;
    return;
  }
  if (pendingTurn) {
    const { opts } = pendingTurn, d = pendingTurn.done;
    if (opts.tsumo) btn('ツモ', 'red', () => d({ type: 'tsumo' }));
    if (me.riichi) {
      for (const k of opts.ankan) btn('カン', '', () => d({ type: 'ankan', k }));
      if (opts.discardable.length) btn(opts.tsumo ? '見送り' : 'ツモ切り', 'ghost', () => d({ type: 'discard', tile: opts.discardable[0] }));
      else if (opts.nuki) btn('抜き', '', () => d({ type: 'nuki' }));
      return;
    }
    const toggle = mode => { riichiMode = riichiMode === mode ? false : mode; const ks = riichiMode === 'open' ? opts.openRiichi : opts.riichi; if (riichiMode && selectedId != null) { const t = me.hand.find(x => x.id === selectedId); if (!t || !ks.includes(t.k)) selectedId = null; } render(); };
    if (opts.riichi.length) btn('リーチ', riichiMode === 'riichi' ? 'on' : '', () => toggle('riichi'));
    if (opts.openRiichi && opts.openRiichi.length) btn('オープン', riichiMode === 'open' ? 'on' : '', () => toggle('open'));
    if (opts.nuki) btn('抜き', '', () => d({ type: 'nuki' }));
    for (const k of opts.ankan) btn('カン ' + S.KIND_NAME[k], '', () => d({ type: 'ankan', k }));
    for (const k of opts.kakan) btn('加槓 ' + S.KIND_NAME[k], '', () => d({ type: 'kakan', k }));
    // ヒント
    if (selectedId != null) {
      const rest = me.hand.filter(t => t.id !== selectedId);
      const wt = waitsText(rest, me.melds.length);
      hint.innerHTML = wt ? `切ると待ち ${wt.txt}` : 'もう一度タップで打牌';
    } else hint.innerHTML = riichiMode ? `<b>${riichiMode === 'open' ? 'オープンリーチ（供託5,000点）' : 'リーチ'}</b>する牌を選んでください` : 'あなたの番です';
    return;
  }
  // 待ち表示
  if (me.hand.length % 3 === 1) {
    const wt = waitsText(me.hand, me.melds.length);
    if (wt) {
      const furi = game.isFuriten(me);
      hint.innerHTML = `待ち ${wt.txt}${furi ? ' <b>フリテン</b>' : ''}`;
    }
  }
}

$('hand').addEventListener('click', e => {
  const el = e.target.closest('.t');
  if (!el || !pendingTurn) return;
  const id = +el.dataset.id;
  const { opts, done } = pendingTurn;
  const t = opts.discardable.find(x => x.id === id);
  if (!t) return;
  if (riichiMode && !(riichiMode === 'open' ? opts.openRiichi : opts.riichi).includes(t.k)) return;
  if (selectedId === id) { done({ type: riichiMode === 'open' ? 'openRiichi' : riichiMode ? 'riichi' : 'discard', tile: t }); return; }
  selectedId = id;
  render();
});

// ---------- 対局イベント ----------
async function onEvent(ev, d, g) {
  const myGen = gen;
  const sp = SPEED[settings.speed];
  switch (ev) {
    case 'handStart': turnSeat = -1; lastDiscardId = -1; handLog = { riichi: false, calls: 0, riichiSeats: [] }; render(); await pause(350); break;
    case 'draw': turnSeat = d.seat; if (d.seat === 0) { SFX.myTurn(); render(); } else { SFX.draw(); render(); await pause(sp.draw); } break;
    case 'discard':
      SFX.discard(); lastDiscardId = d.tile.id; render();
      if (d.riichi) { if (d.seat === 0) handLog.riichi = true; handLog.riichiSeats.push(d.seat); SFX.riichi(d.seat, d.open); announce(d.seat, d.open ? 'オープンリーチ' : 'リーチ'); await pause(sp.call); }
      else await pause(d.seat === 0 ? 120 : sp.discard);
      break;
    case 'riichi': render(); break;
    case 'call': turnSeat = d.seat; if (d.seat === 0) handLog.calls++; SFX.call(d.type === 'pon' ? 'ポン' : 'カン', d.seat); announce(d.seat, d.type === 'pon' ? 'ポン' : 'カン'); render(); await pause(sp.call); break;
    case 'kan': SFX.call('カン', d.seat); announce(d.seat, 'カン'); render(); await pause(sp.call); break;
    case 'nuki4': SFX.call('北4枚', d.seat); announce(d.seat, '北4枚 ' + d.chip + '枚オール'); render(); await pause(900); break;
    case 'nuki': SFX.nuki(d.seat); announce(d.seat, '北'); render(); await pause(d.seat === 0 ? 250 : 420); break;
    case 'win': { const w = d.ev.nagashi ? '流し倍満' : d.tsumo ? 'ツモ' : 'ロン'; SFX.win(w, d.winner, d.ev.han >= 6 || d.ev.ym); announce(d.winner, w); render(); await pause(1000); break; }
    case 'exhaustive': announce(-1, '流局'); SFX.draw2(); render(); await pause(900); break;
  }
  checkGen(myGen);
}

function showModal(html, wide) { const m = $('modal'); m.innerHTML = `<div class="sheet${wide ? ' wide' : ''}">${html}</div>`; m.hidden = false; return m; }
const cols = (a, b) => `<div class="cols"><div class="col">${a}</div><div class="col">${b}</div></div>`;
function hideModal() { $('modal').hidden = true; $('modal').innerHTML = ''; }

function winSheetHTML(r, g, idx, total) {
