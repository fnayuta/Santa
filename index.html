      <!--SPLIT-->
      <div class="total">倍満　${pts}</div>
      ${g.honba ? `<div class="muted">${g.honba}本場 込み</div>` : ''}${r.sticksWon ? `<div class="muted">供託 ${r.sticksWon * 1000}点</div>` : ''}
      ${r.tobi.length ? `<div class="chips">チップ ${r.tobi.map(x => '飛び賞' + x.n + '（' + names[x.from] + '）').join('・')}</div>` : ''}
      <table>${g.players.map((p, i) => `<tr><td>${names[i]}</td><td class="r">${sign(r.delta[i])}</td><td class="r">${r.chipDelta[i] ? (r.chipDelta[i] > 0 ? '+' : '') + r.chipDelta[i] + '枚' : ''}</td></tr>`).join('')}</table>`;
  }
  const winT = r.pocchiAs != null ? tileHTML(r.winTile, { cls: 'win' }) + `<span class="pa">→</span>` + tileHTML({ k: r.pocchiAs }, {}) : tileHTML(r.winTile, { cls: 'win' });
  const tiles = hand.map(t => tileHTML(t)).join('') + '<span class="gap"></span>' + winT
    + (r.melds.length ? '<span class="gap"></span>' + r.melds.slice().reverse().map(m => meldHTML(m, r.winner)).join('<span style="width:4px"></span>') : '')
    + (r.nuki ? '<span class="gap"></span>' + g.players[r.winner].nuki.map(t => tileHTML(t)).join('') : '');
  const yaku = ev.yaku.map(y => `<tr><td>${y.name}</td><td class="r">${y.ym ? '役満' : y.han + '翻'}</td></tr>`).join('');
  const pts = r.tsumo
    ? (r.dealerWon ? `${fmt(r.pay.all)}点オール` : `${fmt(r.pay.child)}・${fmt(r.pay.dealer)}点`)
    : `${fmt(r.pay.ron)}点`;
  const head = ev.ym ? r.limit : `${ev.han}翻${r.limit ? ' ' + r.limit : ''}`;
  const indRow = `<div class="muted">ドラ表示 ${r.doraInd.map(t => tileHTML(t, { w: '18px' })).join('')}${r.uraInd.length ? '　裏 ' + r.uraInd.map(t => tileHTML(t, { w: '18px' })).join('') : ''}</div>`;
  const items = r.chipItems.map(c => c.bonus ? `${c.name}(+${c.n})` : c.name + c.n).concat(r.tobi.map(x => '飛び賞' + x.n + '（' + names[x.from] + '）'));
  const chips = items.length ? `<div class="chips">チップ ${items.join('・')}${r.chipEach ? `　和了分 ${r.tsumo ? '各' : ''}${r.chipEach}枚` : ''}</div>` : '';
  const title = (total > 1 ? `ダブロン ${idx + 1}/${total}　` : '') + (r.tsumo ? 'ツモ' : 'ロン');
  return `<h2>${title}<span class="sub2">${names[r.winner]}${r.loser != null ? ' ← ' + names[r.loser] : ''}</span></h2>
    <div class="handrow">${tiles}</div>${r.pocchiAs != null ? `<div class="muted">${r.pocchiEmerald ? 'エメラルド北ポッチ' : '白ポッチ'}を ${S.KIND_NAME[r.pocchiAs]} として和了</div>` : ''}${indRow}
    <table>${yaku}</table>
    <!--SPLIT-->
    <div class="total">${head}　${pts}</div>
    ${r.mult > 1 ? `<div class="muted">${r.mult === 4 ? 'クリスタル一萬とプラチナ九萬で打点4倍' : 'クリスタル一萬で打点' + r.mult + '倍'}</div>` : ''}
    ${r.pao != null ? `<div class="muted">パオ（${r.paoYaku}の責任払い）：${names[r.pao]}${r.tsumo ? 'が全額' : 'と' + names[r.loser] + 'で半分ずつ'}</div>` : ''}
    ${g.honba ? `<div class="muted">${g.honba}本場 込み</div>` : ''}${r.sticksWon ? `<div class="muted">供託 ${r.sticksWon * 1000}点</div>` : ''}
    ${chips}
    <table>${g.players.map((p, i) => `<tr><td>${names[i]}</td><td class="r">${sign(r.delta[i])}</td><td class="r">${r.chipDelta[i] ? (r.chipDelta[i] > 0 ? '+' : '') + r.chipDelta[i] + '枚' : ''}</td></tr>`).join('')}</table>`;
}
function handEnd(res, g) {
  const myGen = gen;
  recordHand(res);
  const sheets = [];
  const names = g.players.map(p => p.name);
  if (res.type === 'win') res.wins.forEach((r, i) => sheets.push(winSheetHTML(r, g, i, res.wins.length)));
  else {
    const rows = g.players.map((p, i) => `<tr><td>${names[i]}</td><td>${res.tenpai[i] ? '<b>聴牌</b>' : 'ノーテン'}</td><td class="r">${sign(res.delta[i])}</td></tr>`).join('');
    const hands = g.players.map((p, i) => res.tenpai[i] ? `<div class="muted">${names[i]}</div><div class="handrow">${S.sortTiles(res.hands[i].slice()).map(t => tileHTML(t, {})).join('')}</div>` : '').join('');
    sheets.push(`<h2>流局</h2>${hands}<!--SPLIT--><table>${rows}</table>`);
  }
  const standings = `<table class="stand">${g.players.map((p, i) => `<tr><td>${names[i]}</td><td class="r">${fmt(p.points)}</td><td class="r">${p.chips > 0 ? '+' : ''}${p.chips}枚</td></tr>`).join('')}</table>`;
  return new Promise(resolve => {
    let i = 0;
    const show = () => {
      const last = i === sheets.length - 1;
      const [L, R] = sheets[i].split('<!--SPLIT-->');
      showModal(cols(L, (R || '') + (last ? `<div class="muted" style="margin-top:8px">現在</div>${standings}` : '') + `<button class="btn" type="button" id="nextBtn">${last ? '次へ' : '次の和了'}</button><button class="btn alt" type="button" id="peekBtn">河を見る</button>`), true);
      $('nextBtn').onclick = () => { SFX.tap(); if (myGen !== gen) return; if (last) { hideModal(); resolve(); } else { i++; show(); } };
      // 結果を一時的に閉じて卓（河）を見る。「結果に戻る」で元の画面へ
      $('peekBtn').onclick = () => {
        SFX.tap();
        $('modal').hidden = true;
        const back = document.createElement('button');
        back.type = 'button'; back.id = 'peekBack'; back.className = 'act'; back.textContent = '結果に戻る';
        back.onclick = () => { back.remove(); $('modal').hidden = false; };
        document.body.appendChild(back);
      };
    };
    show();
  });
}

function gameEnd(st, g, again) {
  const myYen = again ? Math.round(st.find(r => r.seat === 0).score * YEN_PT + st.find(r => r.seat === 0).chips * YEN_CHIP) : recordGame(st);
  const scoreTd = r => R2 ? '' : `<td class="r">${r.score > 0 ? '+' : ''}${r.score}</td>`;
  const pm = n => (n > 0 ? '+' : '') + n + '枚';
  // 2つ目のゲーム：対局中に獲得したチップ・持ち点によるチップ（終了ボーナス）・合計を分けて表示
  const bonusOf = seat => (g.endBonus || []).reduce((a, b) => a + (b.seat === seat ? b.n : 0) - (b.from === seat ? b.n : 0), 0);
  const chipTds = r => R2 ? `<td class="r">${pm(r.chips - bonusOf(r.seat))}</td><td class="r">${pm(bonusOf(r.seat))}</td><td class="r"><b>${pm(r.chips)}</b></td>` : `<td class="r">${pm(r.chips)}</td>`;
  const rows = st.map(r => `<tr><td>${r.rank}位</td><td>${r.name}</td><td class="r">${fmt(r.points)}</td>${scoreTd(r)}${chipTds(r)}<td class="r">${yenFmt(Math.round(r.score * YEN_PT + r.chips * YEN_CHIP))}</td></tr>`).join('');
  showModal(`<h2>終局</h2>
    <table><tr class="muted"><td></td><td></td><td class="r">点数</td>${R2 ? '<td class="r">対局中のチップ</td><td class="r">持ち点のチップ</td><td class="r">合計</td>' : '<td class="r">スコア</td><td class="r">チップ</td>'}<td class="r">収支</td></tr>${rows}</table>
    <div class="recbig ${myYen >= 0 ? 'plus' : 'minus'}" style="font-size:24px;margin-top:10px">今回 ${yenFmt(myYen)}</div>
    <div class="muted" style="text-align:center">累計 ${yenFmt(records.yen)}（${records.games}半荘）</div>
    ${R2 && g.endBonus && g.endBonus.length ? `<div class="muted">持ち点のチップ：${g.endBonus.map(b => `${g.players[b.seat].name} +${b.n}枚（${g.players[b.from].name}から）`).join('・')}</div>` : ''}
    <p class="muted">${R2 ? '収支はチップだけで計算（チップ1枚＝200円）。点数ではお金は動きません。' : 'スコアは 35,000点持ち40,000点返し・トップにオカ+15・ウマ 20-0-20（1位+20、2位±0、3位−20）。スコア1＝100円、チップ1枚＝500円。'}</p>
    <button class="btn" type="button" id="againBtn">もう一度</button>
    <button class="btn alt" type="button" id="recBtn2">成績を見る</button>`, R2);
  $('againBtn').onclick = () => { hideModal(); openStart(); };
  $('recBtn2').onclick = () => openRecords(() => gameEnd(st, g, true));
}

// ---------- 開始・メニュー ----------
function seg(name, opts) {
  return `<span class="seg" data-name="${name}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" class="${String(settings[name]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</span>`;
}
function bindSegs(root) {
  root.querySelectorAll('.seg').forEach(s => s.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const name = s.dataset.name; let v = b.dataset.v;
    if (v === 'true' || v === 'false') v = v === 'true'; else if (/^\d+$/.test(v)) v = +v;
    settings[name] = v; saveSettings();
    s.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  }));
}
const RULES = `<div class="rules">
  <b>牌</b> 萬子は1・9のみの108枚。5筒・5索は4枚とも特殊牌で、各<b>赤3枚・金1枚</b>（すべてドラ1）。<br>
  <b>北</b> 抜きドラ。捨てられません。<br>
  <b>点数</b> <b>40符固定</b>・<b>ツモ損なし</b>・<b>1,000点単位</b>（100点・500点は使いません）。子1翻ロン2,000／2翻3,000／3翻6,000、4翻で満貫。1本場はロン1,000点・ツモ各1,000点。<br>
  <b>白ポッチ</b> 白のうち1枚。リーチ後にツモったときだけ、いちばん高くなる牌として和了れます。<br>
  <b>クリスタル一萬</b> 1萬のうち1枚（水色）。使って和了ると打点2倍（本場・供託は2倍になりません）。<br>
  <b>プラチナ九萬</b> 9萬のうち1枚（青）。使って和了ると和了時のチップが2倍（飛び賞は2倍になりません）。<br>
  <b>役</b> 数え役満は14翻から。萬子の混一色は役満。流し倍満あり（鳴かれたら無効、和了扱い）。<br>
  <b>パオ</b> 大三元の3つ目・大四喜の4つ目を鳴かせた人が責任払い。ツモなら全額（チップも）、ほかの人からのロンなら放銃者と半分ずつ。<br>
  <b>チップ</b> 金・一発・裏ドラに付く。金2枚を使って和了ると追加で2枚。役満・数え役満は和了時10枚。北を4枚抜いた時点で1枚オール。飛ばした人に2枚（ダブロンで飛んだら2人に2枚ずつ）。<br>
  <b>その他</b> チーなし。35,000点持ち40,000点返し（オカ+15）、ウマ 20-0-20、ノーテン罰符あり、ダブロンあり（供託は放銃者の下家側）。収支はスコア1＝100円・チップ1枚＝500円で計算。
</div>`;
const RULES2 = `<div class="rules">
  <b>基本</b> サンマ・半荘戦・40,000点持ち・順位点なし。途中流局なし。チーなし。ダブロンあり。<br>
  <b>牌</b> 萬子は1・9のみの108枚。5筒・5索は各<b>赤3枚・金1枚</b>（すべてドラ1）。<br>
  <b>特殊牌</b> <b>金</b>：和了時1枚。<b>クリスタル一萬</b>（水色）：和了時打点2倍。<b>プラチナ九萬</b>（青）：和了時チップ2倍。クリスタルとプラチナが両方あると、それぞれ4倍（どちらかが対子のときは4倍にならず、それぞれ2倍）。<b>エメラルド北ポッチ</b>（北の字が緑）：リーチ後にツモるとオールマイティ。抜いてもよく、抜いてもフリテンになりません。<br>
  <b>点数</b> <b>30符固定</b>・<b>ツモ損あり</b>・100の位は切り上げ（3,900→4,000）。満貫は5翻から。1本場はロン2,000点・ツモ各1,000点。ノーテン罰符は場に6,000点。<br>
  <b>役</b> 数え役満は14翻から。萬子の混一色は役満。流し倍満あり。<b>4枚使い七対子</b>あり（カンした場合は不可）：4枚が1組で4翻・2組で8翻・3組で12翻。<b>オープンリーチ</b>あり（2翻、手牌をすべて公開、供託5,000点）。暗槓に対する国士無双の和了あり。<br>
  <b>リーチ</b> 0点ではリーチできません。<br>
  <b>チップ</b> 一発・金・裏ドラに1枚。金2枚で和了るとさらに2枚。役満（数え役満を含む）はロンなら放銃者から10枚、ツモなら5枚ずつ。北を4枚抜いた時点で各1枚。飛ばした人に2枚。<br>
  <b>パオ</b> 大三元の3つ目・大四喜の4つ目を鳴かせた人が責任払い。<br>
  <b>終局</b> 誰かが0点未満でトビ終了。オーラスの親は和了ったら続けるかやめるかを選べます（和了止め）。終了時に50,000点台なら4枚、60,000点台8枚、70,000点台12枚、80,000点台14枚、90,000点台16枚、100,000点台18枚、110,000点以上20枚を、50,000点に届かなかったラスからもらえます。<br>
  <b>収支</b> チップだけで計算（チップ1枚＝200円）。点数ではお金は動きません。
</div>`;
function settingsHTML(inGame) {
  return `${inGame || R2 ? '' : `<div class="opt">対局の長さ ${seg('length', [['tonpu', '東風'], ['hanchan', '半荘']])}</div>
    <div class="opt">金のチップ枚数 ${seg('goldChip', [[1, '1枚'], [2, '2枚'], [3, '3枚'], [5, '5枚']])}</div>`}
    <div class="opt">CPUの速さ ${seg('speed', [['normal', 'ふつう'], ['fast', 'はやい']])}</div>
    <div class="opt">効果音 ${seg('sound', [[true, 'あり'], [false, 'なし']])}</div>
    <div class="opt">発声（ポン・ロンなど） ${seg('voice', [[true, 'あり'], [false, 'なし']])}</div>`;
}
function openStart() {
  const sum = records.games ? `<div class="recline">累計 <b class="${records.yen >= 0 ? 'plus' : 'minus'}">${yenFmt(records.yen)}</b>　${records.games}半荘・平均順位 ${((records.ranks[0] + records.ranks[1] * 2 + records.ranks[2] * 3) / records.games).toFixed(2)}</div>` : '';
  const m = showModal(`<h2>${TITLE}</h2>` + cols(`<div class="muted">CPU 2人と対局</div>${sum}${R2 ? RULES2 : RULES}`, `${settingsHTML(false)}
    <button class="btn" type="button" id="startBtn">対局開始</button>
    <button class="btn alt" type="button" id="recBtn">成績</button>`), true);
  bindSegs(m);
  $('startBtn').onclick = () => { SFX.unlock(); SFX.tap(); hideModal(); startGame(); };
  $('recBtn').onclick = () => openRecords(openStart);
}
$('menuBtn').onclick = () => {
  if (!$('modal').hidden) return;
  const m = showModal(`<h2>メニュー</h2>` + cols(`${settingsHTML(true)}
    <button class="btn" type="button" id="closeBtn">対局に戻る</button>
    <button class="btn alt" type="button" id="menuRec">成績</button>
    <button class="btn alt" type="button" id="restartBtn">対局をやめて最初から</button>`, R2 ? RULES2 : RULES), true);
  bindSegs(m);
  $('closeBtn').onclick = () => { hideModal(); render(); };
  $('menuRec').onclick = () => openRecords(() => { $('modal').hidden = true; $('menuBtn').onclick(); });
  let armed = false;
  $('restartBtn').onclick = e => {
    if (!armed) { armed = true; e.target.textContent = 'もう一度押すと最初から'; return; }
    hideModal(); gen++; pendingTurn = pendingCall = null; openStart();
  };
};

function startGame() {
  gen++;
  const myGen = gen;
  pendingTurn = pendingCall = null; selectedId = null; riichiMode = false;
  const agents = [human, new AI.CpuAgent(NAMES[1]), new AI.CpuAgent(NAMES[2])];
  game = new S.Game(agents, R2 ? { rules: 'r2' } : { length: settings.length, goldChip: settings.goldChip }, { event: onEvent, handEnd, gameEnd, pause });
  game.run().catch(e => { if (!(e instanceof Aborted)) { console.error(e); if (myGen === gen) showModal(`<h2>エラー</h2><p class="muted">${String(e && e.message || e)}</p><button class="btn" type="button" onclick="location.reload()">再読み込み</button>`); } });
}

// ---------- 全画面・画面の消灯防止 ----------
const fsBtn = $('fsBtn');
const canFS = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
if (canFS) fsBtn.hidden = false;
function inFS() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function syncFS() { fsBtn.textContent = inFS() ? '全画面を解除' : '全画面'; }
fsBtn.onclick = async () => {
  try {
    if (inFS()) { await (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    else {
      const el = document.documentElement;
      await (el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen());
    }
  } catch (e) {}
  syncFS();
};
document.addEventListener('fullscreenchange', syncFS);
let wakeLock = null;
async function keepAwake() { try { if (navigator.wakeLock && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', keepAwake);
document.addEventListener('click', function once() { keepAwake(); document.removeEventListener('click', once); });

// ---------- 実際の表示サイズを測る（アドレスバー分を除く） ----------
// 画面の大きさ。縦持ち（幅＜高さ）なら画面を90°回して横画面として使う
let ROT = false, REAL_W = 0;
function measure() {
  const vv = window.visualViewport;
  // ホーム画面アプリでは時計・電池の帯などの分（安全領域の余白）を除いた大きさを使う
  const cs = getComputedStyle(document.documentElement);
  const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0), padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
  const rw = Math.round((vv ? vv.width : window.innerWidth) - padX), rh = Math.round((vv ? vv.height : window.innerHeight) - padY);
  ROT = rw < rh; REAL_W = rw;
  const W = ROT ? rh : rw, H = ROT ? rw : rh;
  const de = document.documentElement;
  de.classList.add('land');
  de.classList.toggle('rot', ROT);
  de.classList.toggle('big', H >= 600);
  de.style.setProperty('--W', W + 'px');
  de.style.setProperty('--H', H + 'px');
}
// 画面上の位置（getBoundingClientRect）→ 回した画面の中の位置
function toLocal(x, y) { return ROT ? [y, REAL_W - x] : [x, y]; }
measure();
window.addEventListener('resize', () => { measure(); render(); });
window.addEventListener('orientationchange', () => setTimeout(() => { measure(); render(); }, 250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', measure);

// ---------- 自動和了・自動北抜きの切り替え ----------
function syncToggles() {
  $('tgWin').classList.toggle('on', !!settings.autoWin);
  $('tgNuki').classList.toggle('on', !!settings.autoNuki);
}
$('tgWin').onclick = () => { settings.autoWin = !settings.autoWin; saveSettings(); syncToggles(); SFX.tap();
  if (settings.autoWin && pendingTurn && pendingTurn.opts.tsumo) pendingTurn.done({ type: 'tsumo' });
  else if (settings.autoWin && pendingCall && pendingCall.o.ron) pendingCall.done({ type: 'ron' }); };
$('tgNuki').onclick = () => { settings.autoNuki = !settings.autoNuki; saveSettings(); syncToggles(); SFX.tap(); };
syncToggles();

openStart();
})();
</script>
